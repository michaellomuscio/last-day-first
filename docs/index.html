    { key: 'sys', title: 'Systems: Where Two Conditions Hold at Once', days: 20, source: 'curate',
      questions: ['How can two different rules both be true at the same moment?', 'When you must meet several requirements at once, how do you know a solution exists?'],
      goals: [
        { key: 'sys-u1', text: 'The graph of an equation is the set of all pairs that make it true, so a solution of a system is a point on every graph at once; two lines in a plane can therefore meet once, never (parallel) or everywhere (the same line).', kind: 'understanding', priority: 'lasting', level: 3, after: ['eq-u1', 'lin-u2'] },
        { key: 'sys-u2', text: 'Substituting, or adding a multiple of one equation to another, turns a system into a simpler one with exactly the same solutions, because each such step keeps true equations true and can be undone.', kind: 'understanding', priority: 'lasting', level: 3, after: ['eq-u2', 'sys-u1'] },
        { key: 'sys-k1', text: 'System of equations, solution of a system, and the three cases (one solution, none, infinitely many); the solution region of a system of inequalities.', kind: 'knowledge', priority: 'important', level: 1, after: [] },
        { key: 'sys-s1', text: 'Solve a system of two linear equations by graphing, by substitution and by elimination, and choose the method that fits.', kind: 'skill', priority: 'important', level: 2, after: ['eq-s1', 'lin-s2'] },
        { key: 'sys-s2', text: 'Model a situation with a system, solve it, and say what the solution means and whether it makes sense.', kind: 'skill', priority: 'important', level: 3, after: ['eq-s2', 'sys-s1'] },
        { key: 'sys-s3', text: 'Graph the solution region of a linear inequality in two variables or of a system of them, and test a point to check it.', kind: 'skill', priority: 'important', level: 2, after: ['eq-s1', 'lin-s2'] },
      ],
      major: { title: 'The fundraiser decision', method: 'performance', targets: ['reasoning', 'product'], level: 3, goals: ['sys-u1', 'sys-u2', 'sys-s1', 'sys-s2', 'sys-s3'], min: 50, out: 45, fb: 'rubric', rubric: 'analytic', retake: true,
        role: 'A business consultant for a student club selling shirts', audience: 'The club’s officers', product: 'A recommendation choosing between two vendors (each with a set-up fee and a price per shirt), with both cost equations, a graph, the break-even point found by two methods, a statement of when each vendor is cheaper, and the club’s budget limit written as an inequality with the order sizes that fit it shaded on a graph of cost against shirts' },
      minors: [
        { title: 'Terms and cases check', method: 'selected', targets: ['knowledge'], level: 1, goals: ['sys-k1'], min: 10, fb: 'score' },
        { title: 'Solve it two ways', method: 'performance', targets: ['skill'], level: 2, goals: ['sys-s1'], min: 20, fb: 'comments' },
        { title: 'One, none or infinitely many?', method: 'written', targets: ['reasoning'], level: 3, goals: ['sys-u1', 'sys-u2'], min: 15, fb: 'comments' },
      ] },

    { key: 'dat', title: 'Fitting Lines to Data', days: 14, source: 'curate',
      questions: ['When does a line tell the truth about data?', 'If two things move together, does one cause the other?'],
      goals: [
        { key: 'dat-u1', text: 'A line fitted to data can describe a pattern and predict inside the range of the data, but a pattern alone cannot show that one thing causes another; only how the data were gathered, such as a randomized experiment, can.', kind: 'understanding', priority: 'lasting', level: 3, after: ['lin-u2'] },
        { key: 'dat-u2', text: 'A line is a good model only if the points scatter around it with no pattern left over; a high correlation alone does not show this, and a residual plot can reveal a curve or an outlier that the correlation hides.', kind: 'understanding', priority: 'lasting', level: 3, after: ['dat-u1', 'dat-k1'] },
        { key: 'dat-k1', text: 'Scatter plot, line of best fit, residual (actual value minus predicted value), correlation coefficient r (between −1 and 1; it measures only how closely points follow a straight line), interpolation, extrapolation, outlier, and the difference between correlation and causation.', kind: 'knowledge', priority: 'important', level: 1, after: [] },
        { key: 'dat-s1', text: 'Make a scatter plot, fit a line by eye and with technology, and interpret its slope and intercept in context, saying when the intercept has no real meaning.', kind: 'skill', priority: 'important', level: 2, after: ['lin-s2'] },
        { key: 'dat-s2', text: 'Use a residual plot and the correlation coefficient to judge a line as a model, and decide whether a prediction can be trusted.', kind: 'skill', priority: 'important', level: 3, after: ['dat-s1', 'dat-u2'] },
        { key: 'dat-s3', text: 'Read a two-way frequency table, including relative frequencies, to describe an association between two categories.', kind: 'skill', priority: 'familiar', level: 2, after: [] },
      ],
      major: { title: 'The claim check', method: 'performance', targets: ['reasoning', 'product'], level: 3, goals: ['dat-u1', 'dat-u2', 'dat-s1', 'dat-s2'], min: 50, out: 45, fb: 'rubric', rubric: 'analytic', retake: true,
        role: 'A data journalist checking a claim', audience: 'Readers of a school news site', product: 'A one-page fact-check on a real data set you choose (for example winning times in the Olympic 100 meters), with scatter plot, fitted line, residual plot, a prediction inside the range of the data and one outside it with its limits, and a verdict on what the data can and cannot say about cause' },
      minors: [
        { title: 'Data vocabulary check', method: 'selected', targets: ['knowledge'], level: 1, goals: ['dat-k1'], min: 10, fb: 'score' },
        { title: 'Fit a line and read it', method: 'performance', targets: ['skill'], level: 2, goals: ['dat-s1'], min: 20, fb: 'comments' },
        { title: 'Can we trust this prediction?', method: 'written', targets: ['reasoning'], level: 3, goals: ['dat-u1', 'dat-u2', 'dat-s2'], min: 15, fb: 'comments' },
      ] },

    { key: 'exp', title: 'Exponents and Exponential Growth', days: 20, source: 'curate',
      questions: ['Why do some things grow slowly at first and then seem to explode?', 'How can a quantity that grows by a small percent each time become enormous?'],
      goals: [
        { key: 'exp-u1', text: 'A linear function adds the same amount each step, while an exponential function multiplies by the same factor each step, so a quantity that starts above zero and is multiplied by a factor greater than 1 each step eventually passes any linear quantity, however slowly it starts.', kind: 'understanding', priority: 'lasting', level: 3, after: ['lin-u2'] },
        { key: 'exp-u2', text: 'Exponent rules follow from what an exponent means: for whole numbers m and n, a^m · a^n = a^(m+n) just counts factors, and defining a^0 = 1 and a^(−n) = 1/a^n, for a not zero, is the only choice that keeps those rules true.', kind: 'understanding', priority: 'lasting', level: 3, after: ['eq-k1'] },
        { key: 'exp-k1', text: 'Exponent, base, growth factor, decay factor, initial value, percent change and scientific notation.', kind: 'knowledge', priority: 'important', level: 1, after: [] },
        { key: 'exp-s1', text: 'Simplify expressions with integer exponents using the product, quotient and power rules, and write numbers in scientific notation.', kind: 'skill', priority: 'important', level: 2, after: ['exp-u2'] },
        { key: 'exp-s2', text: 'Write and graph y = a·b^x (with a not zero, b positive and b not 1) from a table or a situation, say what a and b mean, and use it to answer questions about growth, decay and compound interest.', kind: 'skill', priority: 'important', level: 3, after: ['lin-s2', 'eq-s2'] },
        { key: 'exp-s3', text: 'Find when an exponential quantity reaches a target value by a table or graph, without logarithms.', kind: 'skill', priority: 'familiar', level: 2, after: ['exp-s2'] },
      ],
      major: { title: 'The growth report', method: 'performance', targets: ['reasoning', 'product'], level: 3, goals: ['exp-u1', 'exp-u2', 'exp-s2'], min: 50, out: 60, fb: 'rubric', rubric: 'analytic', retake: true,
        role: 'A public-health analyst', audience: 'A town council deciding how early to act', product: 'A report using data from a spreading experiment you run with dice (start with 30 dice; after each roll, add one die for every 6 shown), modeled by an exponential function and compared with the best linear fit, with a prediction, a percent-change explanation, a table extended backward from the start that shows why b^0 = 1 and b^(−1) = 1/b follow from the same growth factor, and an account of where the model must break down' },
      minors: [
        { title: 'Exponent and growth terms check', method: 'selected', targets: ['knowledge'], level: 1, goals: ['exp-k1'], min: 10, fb: 'score' },
        { title: 'Simplify and explain a rule', method: 'performance', targets: ['skill'], level: 2, goals: ['exp-s1'], min: 15, fb: 'comments' },
        { title: 'Linear or exponential, and how do you know?', method: 'written', targets: ['reasoning'], level: 3, goals: ['exp-u1'], min: 15, fb: 'comments' },
      ] },

    { key: 'pol', title: 'Polynomials and Factoring', days: 18, source: 'curate',
      questions: ['What does it mean for two expressions that look different to be the same?', 'Why would you write a sum as a product?'],
      goals: [
        { key: 'pol-u1', text: 'Two expressions are the same only if they have the same value for every input, and multiplying out and factoring are the same equality read in opposite directions: (x + 3)² = x² + 6x + 9 for every x, but (x + 3)² and x² + 9 agree only when x = 0.', kind: 'understanding', priority: 'lasting', level: 3, after: ['eq-k1', 'eq-u2'] },
        { key: 'pol-u2', text: 'A product is zero exactly when at least one factor is zero, so writing an expression as a product turns the question of where it is zero into several simple ones.', kind: 'understanding', priority: 'lasting', level: 3, after: ['eq-u1', 'pol-u1'] },
        { key: 'pol-k1', text: 'Monomial, binomial, trinomial, degree, standard form, leading coefficient and greatest common factor, and the fact that the sum, difference and product of polynomials are polynomials.', kind: 'knowledge', priority: 'important', level: 1, after: [] },
        { key: 'pol-s1', text: 'Add, subtract and multiply polynomials, using the distributive property and an area model.', kind: 'skill', priority: 'important', level: 2, after: ['eq-k1', 'pol-k1'] },
        { key: 'pol-s2', text: 'Factor out a common factor and factor trinomials x² + bx + c and ax² + bx + c, checking by multiplying back, and recognize when a trinomial has no factors with whole-number coefficients, such as x² + x + 1.', kind: 'skill', priority: 'important', level: 3, after: ['pol-s1', 'pol-u1'] },
        { key: 'pol-s3', text: 'Recognize and factor a difference of two squares and a perfect square trinomial, and know that a sum of squares such as x² + 9 does not factor into real linear factors.', kind: 'skill', priority: 'familiar', level: 2, after: ['pol-s2'] },
      ],
      major: { title: 'The garden bed and the polynomial', method: 'performance', targets: ['reasoning', 'skill', 'product'], level: 3, goals: ['pol-u1', 'pol-u2', 'pol-s1', 'pol-s2'], min: 50, out: 30, fb: 'rubric', rubric: 'analytic', retake: true,
        role: 'A designer for a community garden', audience: 'The garden committee, who will check your numbers', product: 'A report on a rectangular bed with sides x + 3 and x + 4 feet: an area model and the expanded area, a check by substituting three values of x, a test of (x + 3)² against x² + 9 and x² + 6x + 9 that finds where each pair agrees, four expressions you factor (one that has no whole-number factors, with the reason), and the break-even number of plants from a profit expression such as x² − 5x − 14 found from its factors, with what each answer means or why one is rejected' },
      minors: [
        { title: 'Terms and degree quiz', method: 'selected', targets: ['knowledge'], level: 1, goals: ['pol-k1'], min: 10, fb: 'score' },
        { title: 'Multiply with an area model', method: 'performance', targets: ['skill'], level: 2, goals: ['pol-s1'], min: 15, fb: 'comments' },
        { title: 'Factor and check', method: 'performance', targets: ['skill'], level: 3, goals: ['pol-s2'], min: 15, fb: 'score' },
      ] },

    { key: 'qua', title: 'Quadratic Functions and Equations', days: 26, source: 'curate',
      questions: ['Why does a thrown ball trace a curve, and what does the curve tell you about where it lands?', 'When does an equation have two answers, one answer, or none?'],
      goals: [
        { key: 'qua-u1', text: 'A quadratic changes at a changing rate: equal steps in the input give changes in the output that themselves change by a constant amount, so its graph is a parabola with one vertex, where the quantity stops rising and starts falling (or the reverse), and a line of symmetry through it.', kind: 'understanding', priority: 'lasting', level: 3, after: ['lin-u2', 'exp-u1'] },
        { key: 'qua-u2', text: 'Solving ax² + bx + c = 0 (with a not zero) means finding where the graph of y = ax² + bx + c meets the x-axis; completing the square on the general equation gives the quadratic formula, and the sign of the discriminant b² − 4ac under its square root says whether the graph crosses the axis twice, touches it once or misses it.', kind: 'understanding', priority: 'lasting', level: 3, after: ['pol-u1', 'pol-u2', 'eq-u2'] },
        { key: 'qua-s1', text: 'Solve quadratic equations by factoring, taking square roots (keeping both the positive and negative root), completing the square and the quadratic formula, leaving exact answers such as 1 ± √3 or rounding sensibly, and choose among the methods.', kind: 'skill', priority: 'important', level: 2, after: ['pol-s2', 'eq-s1'] },
        { key: 'qua-s2', text: 'Move between standard, vertex and factored forms and say what each shows at a glance: the y-intercept (standard), the vertex (vertex form) or the x-intercepts (factored), and whether the parabola opens up or down.', kind: 'skill', priority: 'important', level: 3, after: ['qua-u1', 'pol-s2', 'pol-s3'] },
        { key: 'qua-s3', text: 'Model a situation such as a thrown ball or a rectangle with fixed perimeter by a quadratic, solve it, and decide which solutions make sense in context.', kind: 'skill', priority: 'important', level: 3, after: ['eq-s2', 'sys-s2'] },
        { key: 'qua-k1', text: 'A line y = mx + b and a parabola can meet twice, once or never, found with a graphing tool.', kind: 'knowledge', priority: 'familiar', level: 2, after: ['sys-u1'] },
      ],
      major: { title: 'Will the shot go in?', method: 'performance', targets: ['reasoning', 'skill', 'product'], level: 3, goals: ['qua-u1', 'qua-u2', 'qua-s2', 'qua-s3'], min: 50, out: 60, fb: 'rubric', rubric: 'analytic', retake: true,
        role: 'A sports analyst', audience: 'A basketball coach who wants to adjust a player’s release', product: 'A report using ball positions read from a video of a free throw, a quadratic model in vertex form, the maximum height, an equation solved to decide whether the ball passes through the hoop (with both roots interpreted), the discriminant used to say whether the ball ever reaches hoop height, and what changing the launch speed or angle would do' },
      minors: [
        { title: 'Solve four ways', method: 'performance', targets: ['skill'], level: 2, goals: ['qua-s1'], min: 20, fb: 'comments' },
        { title: 'Forms: what each one shows', method: 'written', targets: ['reasoning'], level: 3, goals: ['qua-s2', 'qua-u1'], min: 15, fb: 'comments' },
        { title: 'Two, one or none?', method: 'written', targets: ['reasoning'], level: 3, goals: ['qua-u2'], min: 15, fb: 'comments' },
      ] },

    { key: 'mod', title: 'Choosing a Model', days: 16, source: 'build',
      questions: ['How do you decide what kind of function a situation calls for?', 'What do you give up when you use a model?'],
      goals: [
        { key: 'mod-u1', text: 'A model is a deliberate simplification, so using one means saying what it assumes, how far from the data it can be trusted and what would show it wrong.', kind: 'understanding', priority: 'lasting', level: 3, after: ['dat-u1', 'dat-u2'] },
        { key: 'mod-u2', text: 'Each family of functions leaves a fingerprint: equal differences mean linear, equal ratios mean exponential and equal second differences mean quadratic when the inputs are equally spaced, and testing for these, allowing for the scatter in real data, is how you choose a model.', kind: 'understanding', priority: 'lasting', level: 3, after: ['lin-u2', 'exp-u1', 'qua-u1'] },
        { key: 'mod-k1', text: 'How linear, exponential and quadratic functions grow, where they cross the axes and what happens for very large inputs.', kind: 'knowledge', priority: 'important', level: 2, after: ['lin-k1', 'exp-k1', 'qua-u1'] },
        { key: 'mod-s1', text: 'Given a table, a graph or a description, decide whether a relationship is linear, exponential or quadratic, and justify the choice with differences or ratios.', kind: 'skill', priority: 'important', level: 3, after: ['mod-u2', 'exp-s2'] },
        { key: 'mod-s2', text: 'Build a model from real data with technology, state its assumptions and limits, and explain the result to someone who has not studied algebra.', kind: 'skill', priority: 'important', level: 4, after: ['dat-s2', 'qua-s3'] },
        { key: 'mod-s3', text: 'Compare the average rate of change of two functions over an interval.', kind: 'skill', priority: 'familiar', level: 2, after: ['lin-s1'] },
      ],
      major: { title: 'The model brief', method: 'performance', targets: ['reasoning', 'skill', 'product'], level: 4, goals: ['mod-u1', 'mod-u2', 'mod-s1', 'mod-s2'], min: 60, out: 90, fb: 'rubric', rubric: 'analytic', retake: false,
        role: 'An analyst for a science magazine', audience: 'General readers', product: 'A two-page brief on one of three real data sets (carbon dioxide at Mauna Loa, a cooling cup of coffee, using its temperature above room temperature, or the stopping distance of a car at different speeds), comparing at least two candidate models, choosing one by the fingerprints in the data, and stating its limits' },
      minors: [
        { title: 'Which family? Sort with reasons', method: 'written', targets: ['reasoning'], level: 3, goals: ['mod-s1', 'mod-k1'], min: 20, fb: 'comments' },
        { title: 'From table to rule', method: 'performance', targets: ['skill'], level: 3, goals: ['mod-s1'], min: 15, fb: 'comments' },
        { title: 'Model critique conversation', method: 'personal', targets: ['reasoning'], level: 3, goals: ['mod-u1'], min: 10, fb: 'conference' },

    { key: 'cel', title: 'Cells: The Smallest Living Units', days: 20, source: 'curate',

/* The shell: state, saving, data binding, navigation, and the small HTML helpers every workspace uses. */
const App = { c: null, view: 'start', sel: {}, findings: [], modal: null, play: { on: false, t: 0 } };
const VIEWS = {}, ACT = {}, MENTOR = {};
const $ = (id) => document.getElementById(id);
const CHAPTERS = [['goals', 'Goals', 'What should last'], ['sequence', 'Sequence', 'Scope and sequence'], ['evidence', 'Evidence', 'Assessments'], ['calendar', 'Calendar', 'Pacing guide'],
  ['lessons', 'Lessons', 'Units and lessons'], ['homework', 'Homework', 'Homework'], ['syllabus', 'Syllabus', 'Syllabus'], ['report', 'Report', 'Label, grades, fingerprint']];

/* ---------- saving ---------- */
const SAVE_KEY = 'ldf-course-1';
let saveTimer = 0;
function saveNow() { try { if (App.c && !App.c.demo) localStorage.setItem(SAVE_KEY, JSON.stringify(App.c)); } catch (e) { /* storage is optional */ } }
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function loadSaved() { try { const t = localStorage.getItem(SAVE_KEY); if (!t) return null; const c = JSON.parse(t); return c && Array.isArray(c.units) ? migrate(c) : null; } catch (e) { return null; } }
/* Nothing typed in the last moment is lost when the page is closed, hidden or left. */
const flushSave = () => { clearTimeout(saveTimer); saveNow(); };
window.addEventListener('pagehide', flushSave); window.addEventListener('beforeunload', flushSave); document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
function download(name, text, mime) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- binding: "kind:id:prop" names a field on the course ---------- */
function resolve(kind, id) {
  const c = App.c;
  switch (kind) {
    case 'course': return c; case 'school': return c.school; case 'intent': return c.intent; case 'syllabus': return c.syllabus; case 'weights': return c.syllabus.weights;
    case 'goal': return goalOf(c, id); case 'unit': return unitOf(c, id); case 'lesson': return lessonOf(c, id); case 'assess': return assessOf(c, id);
    case 'hw': { const l = lessonOf(c, id); return l ? l.hw : null; }
    case 'block': { const p = id.split('/'), l = lessonOf(c, p[0]); return l ? byId(l.blocks, p[1]) : null; }
    case 'sw': { const p = id.split('/'), l = lessonOf(c, p[0]), b = l ? byId(l.blocks, p[1]) : null; return b ? (b.sw = b.sw || {}) : null; }
    case 'ui': return App.sel; case 'rep': return App.rep;
  }
  return null;
}
const parseVal = (v) => (v === 'true' ? true : v === 'false' ? false : v === 'null' ? null : v !== '' && !isNaN(v) ? +v : v);
function setPath(path, value) { const p = path.split(':'), o = resolve(p[0], p[1]); if (o) o[p[2]] = value; return !!o; }
function getPath(path) { const p = path.split(':'), o = resolve(p[0], p[1]); return o ? o[p[2]] : undefined; }

/* ---------- HTML helpers (all return strings) ---------- */
const attrs = (a) => (a ? ' ' + a : '');
const seg = (path, options, cur) => '<span class="seg" role="group">' + options.map((o) => '<button data-act="set" data-arg="' + path + '=' + o[0] + '" aria-pressed="' + (String(cur) === String(o[0])) + '"' + (o[2] ? ' title="' + esc(o[2]) + '"' : '') + '>' + esc(o[1]) + '</button>').join('') + '</span>';
const chips = (path, options, cur) => '<span class="chips">' + options.map((o) => '<button class="chip" data-act="toggle" data-arg="' + path + '=' + o[0] + '" aria-pressed="' + (cur || []).includes(o[0]) + '"' + (o[2] ? ' title="' + esc(o[2]) + '"' : '') + '>' + esc(o[1]) + '</button>').join('') + '</span>';
const field = (path, value, a) => '<input class="field" data-bind="' + path + '" value="' + esc(value) + '"' + attrs(a) + '>';
const area = (path, value, a) => '<textarea class="area" data-bind="' + path + '"' + attrs(a) + '>' + esc(value) + '</textarea>';
const stepper = (path, value, min, max, step) => '<span class="step"><button data-act="nudge" data-arg="' + path + '=' + (-(step || 1)) + '=' + min + '=' + max + '" aria-label="Less">−</button><input type="number" data-bind="' + path + '" data-num min="' + min + '" max="' + max + '" value="' + value + '" aria-label="Amount"><button data-act="nudge" data-arg="' + path + '=' + (step || 1) + '=' + min + '=' + max + '" aria-label="More">+</button></span>';
const pick = (path, options, cur, a) => '<select class="pick" data-bind="' + path + '"' + attrs(a) + '>' + options.map((o) => '<option value="' + esc(o[0]) + '"' + (String(cur) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
const short = (s, n) => (s.length > (n || 60) ? s.slice(0, (n || 60) - 1).trimEnd() + '…' : s);
const goalPicker = (path, goals, sel) => (goals.length ? '<span class="chips">' + goals.map((g) => '<button class="chip" data-act="toggle" data-arg="' + path + '=' + g.id + '" aria-pressed="' + (sel || []).includes(g.id) + '" title="' + esc(g.text) + '">' + esc(short(g.text || 'Untitled goal', 46)) + '</button>').join('') + '</span>' : '<span class="hint">No goals here yet. Add them under Goals.</span>');
const tag = (text, tone) => '<span class="tag ' + (tone || '') + '">' + esc(text) + '</span>';
const empty = (text, button) => '<div class="empty"><p>' + text + '</p>' + (button || '') + '</div>';
const mentor = (lines) => (lines && lines.length ? '<div class="mentor"><b>From your mentor</b>' + lines.map((l) => '<p>' + l + '</p>').join('') + '</div>' : '');
const optName = (table, id) => { const o = table.find((x) => x[0] === id); return o ? o[1] : ''; };

const GLOSSARY = [

  ['Lasting, important, worth meeting', 'Three sizes of goal. Lasting ideas are the few a student should keep for life. Important ones are needed to reach them. Worth meeting is good to have seen, and the first to cut.'],
  ['Understanding, knowledge, skill', 'An understanding is a big idea stated as a claim. Knowledge is facts, terms and concepts. A skill is something a student can do.'],
  ['Evidence', 'What you would need to see to believe a student reached a goal: a task, a test, a conversation, a piece of work.'],
  ['Selected response', 'Questions where students choose an answer: multiple choice, matching, true or false, fill in the blank.'],
  ['Written response', 'Students write the answer themselves, from a sentence to an essay.'],
  ['Performance', 'Students make or do something that is judged against stated criteria: a lab report, a speech, a model, a recital.'],
  ['Personal communication', 'You find out by talking with or watching a student: a conference, an oral exam, questions in class with notes kept.'],
  ['Take in, make meaning, transfer', 'What a block of class time is for. Take in: something new is introduced. Make meaning: students work out why, compare, explain or connect. Transfer: students use it on their own in a situation they have not seen.'],
  ['Thinking level', 'How much thinking a task asks for, in four steps: recall a fact; apply a skill or concept; strategic thinking (reason, plan and justify, with more than one sound answer); extended thinking (investigate and create over time). The steps follow Norman Webb\u2019s Depth of Knowledge.'],
  ['Taking it in, working with it, creating, building with others', 'Four ways a student can be engaged: receiving (listening, watching); doing something with the material (notes, practice); producing something new (explaining, writing, solving an unfamiliar problem); and producing it with other people.'],
  ['Who does the thinking', 'Whether the teacher is doing the reasoning aloud, the class is sharing it, students are doing it together, or each student is doing it alone.'],
  ['Retrieval', 'Pulling something learned earlier back out of memory without looking it up. A few questions at the start of class on last week\u2019s material is retrieval.'],
  ['Setup, moving, waiting', 'Minutes that are not learning: settling in at the bell, getting into groups, handing out materials, packing up. The tool adds an estimate of these to every lesson; you can change how generous it is under Calendar.'],
  ['Learning Facts', 'The label on every lesson, unit and course. It reports what students would be doing if the plan ran as written. It measures the plan, not the room.'],
  ['The web of ideas', 'A picture of your goals as dots joined by lines where one builds on another. A simulated class runs through your plan and the picture shows which ideas are likely to hold and connect. It is an illustration, not a forecast.'],
  ['Stress test', 'Runs the year again with the days a real school year loses to weather, assemblies and testing, to show what would be squeezed.'],

  const fb = answered ? '<p id="gl-fb" class="gl-fb ' + (ans === q.k ? 'ok' : 'no') + '"><b>' + (ans === q.k ? 'Right.' : 'Not quite. This is ' + goalsKindName[q.k] + '.') + '</b> ' + esc(q.why) + '</p><div class="foot"><button class="btn pri" data-act="goalNext" id="gl-next" aria-describedby="gl-fb">' + (G.i + 1 >= n ? 'See my score' : 'Next statement') + '</button></div>' : '';
  return top + '<h2 id="gl-game-h">Fact, skill or big idea?</h2>' + dots + '<p class="lbl">Statement ' + (G.i + 1) + ' of ' + n + '</p><p class="gl-q">“' + esc(q.t) + '”</p><div class="gl-choices" role="group" aria-label="What kind of goal is this statement">' + btns + '</div>' + fb;
}
function goalsGameShow() { openModal('<div class="gl-mod">' + goalsGameHTML() + '</div>'); const b = $('gl-next') || document.querySelector('#modal .gl-choice:not(:disabled)') || document.querySelector('#modal .btn.pri'); if (b) b.focus({ preventScroll: true }); }
ACT.goalPractice = () => { goalsGameStart(); goalsGameShow(); return false; };
ACT.goalAnswer = (a) => { if (!goalsGame || goalsGame.done || goalsGame.got[goalsGame.i] != null) return false; goalsGame.got[goalsGame.i] = a; goalsGameShow(); return false; };
ACT.goalNext = () => { if (!goalsGame) return false; goalsGame.i++; if (goalsGame.i >= goalsGame.order.length) goalsGame.done = true; goalsGameShow(); return false; };

/* ---------- the view ---------- */
VIEWS.goals = {
  name: 'Goals',
  render(c) {
    goalsClean(c);
    const lasting = c.goals.filter((g) => g.priority === 'lasting').length;
    return '<div class="ws gl"><div class="ws-head"><div class="eyebrow">Chapter 1</div><h1>What should last</h1>' +
      '<p>Begin with what students should still understand and be able to do years from now. Everything else in the course is built to get them there.</p></div>' +
      '<div class="gl-narrow">' + mentor(MENTOR.goals(c)) + '</div>' +
      '<section class="panel gl-aim"><label class="gl-aimh" for="gl-aim">The aim of the course</label><p class="hint">Finish this sentence in your own words. Keep it to what a student could do alone, long after your class.</p>' +
      '<div class="gl-lead">Years from now, on their own, students should be able to…</div>' +
      '<textarea class="area" id="gl-aim" data-bind="course::transfer" rows="3" placeholder="…explain how living things work, and weigh a health claim against the evidence for it.">' + esc(c.transfer) + '</textarea></section>' +
      '<div class="row between wrap"><div class="stack" style="gap:2px"><h2 class="gl-h2">Goals, by how much they matter</h2><p class="hint">A goal is one thing students should know, be able to do, or understand. The Lasting column should be short.</p></div>' +
      '<button class="btn" data-act="goalPractice">Practise: fact, skill or big idea?</button></div>' +
      goalsColumns(c) +
      '<section class="panel gl-web"><h2>The web of ideas <small>' + plural(c.goals.length, 'dot') + '</small></h2>' +
      '<p class="hint">Dots are what students should know. Lines are how ideas connect, and connected ideas are the ones that last.</p>' +
      '<div class="gl-legend"><span><i class="k l" aria-hidden="true"></i>Lasting: large solid dot</span><span><i class="k i" aria-hidden="true"></i>Important: medium open dot</span><span><i class="k f" aria-hidden="true"></i>Worth meeting: small grey dot</span></div>' +
      '<div data-live="goalweb">' + goalsWebHTML(c) + '</div></section></div>';
  },
  after(root) {
    if (!goalsUI.focus) return;
    const t = root.querySelector('[data-bind="goal:' + goalsUI.focus + ':text"]'); goalsUI.focus = null;
    if (t) { t.focus({ preventScroll: true }); t.scrollIntoView({ block: 'nearest' }); }
  },
};

MENTOR.goals = (c) => {
  const g = c.goals, out = [], lasting = g.filter((x) => x.priority === 'lasting'), aim = c.transfer.trim();
  if (!g.length && !aim) return ['Start with the aim. What should a student be able to do, on their own, long after your class?'];
  if (!aim) out.push('You have goals but no aim yet. Write the one sentence all of them should serve.');
  if (g.length && !lasting.length) out.push('Nothing is marked lasting yet. Pick the one or two ideas you would want a student to hold in ten years.');
  else if (g.length >= 3 && g.every((x) => x.kind === 'knowledge')) out.push('Every goal is knowledge. Facts matter, but what will students still be able to explain or do in ten years?');
  else if (lasting.length > goalsNeed(c)) out.push('That is a lot of lasting goals. Keep two or three per unit at most, or none will feel lasting.');
  if (out.length < 2 && g.length >= 3 && !g.some((x) => x.after.length)) out.push('None of your goals connect yet. Draw a line from each idea to the one it builds on.');
  if (out.length < 2 && g.some((x) => !x.text.trim())) out.push('Some goals are still blank. Say what you mean in a sentence, or delete them.');
  if (out.length < 2 && g.length && g.some((x) => !x.unit) && c.units.length) out.push('Some goals have no unit yet. The next chapter is where they find a home.');
  if (!out.length) out.push('This is taking shape. Read the lasting goals aloud. Could a stranger tell what you plan to teach?');
  return out.slice(0, 2);
};

/* ---------- actions ---------- */
ACT.goalAdd = (pr, c) => { const g = addGoal(c, { priority: pr, kind: pr === 'lasting' ? 'understanding' : 'knowledge', level: pr === 'lasting' ? 3 : pr === 'important' ? 2 : 1, text: '' }); goalsUI.focus = g.id; };
ACT.goalMove = (a, c) => { const p = a.split('='), g = goalOf(c, p[0]); if (g) g.priority = p[1]; };
ACT.goalDel = (a, c) => { if (App.sel.goal === a) App.sel.goal = null; removeGoal(c, a); toast('Goal deleted.'); };
ACT.goalClear = () => { App.sel.goal = null; };
ACT.goalUnlink = (a, c) => { const p = a.split('='), g = goalOf(c, p[0]); if (g) g.after = g.after.filter((x) => x !== p[1]); };
ACT.goalDot = (id, c) => {
  const first = App.sel.goal && goalOf(c, App.sel.goal);
  if (!first) { App.sel.goal = id; return; }
  if (first.id === id) { App.sel.goal = null; return; }
  const second = goalOf(c, id); if (!second) return;
  if (first.after.includes(id)) { first.after = first.after.filter((x) => x !== id); toast('Line removed.'); return; }
  if (goalsReach(c, id, first.id)) { toast(second.after.includes(first.id) ? 'The other goal already builds on this one. Two goals cannot build on each other.' : 'That would make a circle of goals that build on each other.'); return; }
  first.after.push(id); toast('Now this goal builds on the one you clicked.');
};
/* The web has taller rows on touch screens, so redraw it when the screen crosses that line. */
let goalsWasTouch = goalsTouch(), goalsRz = 0;
window.addEventListener('resize', () => { clearTimeout(goalsRz); goalsRz = setTimeout(() => { const t = goalsTouch(); if (t !== goalsWasTouch) { goalsWasTouch = t; if (App.view === 'goals' && App.c && !App.modal) render(); } }, 150); });
document.addEventListener('keydown', (ev) => {
  const el = ev.target; if (!el || !el.classList || !el.classList.contains('gl-dot')) return;
  if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});

/* Chapter 2, "Scope and sequence": decide what gets the days. Day budget bar, units in teaching order, the tray of goals with no unit,
   and a rough estimate of your own preparation hours. Everything here is prefixed seq / ACT.seq. */
const seqUI = { focusUnit: null, focusQ: null };
const seqSrc = (id) => SOURCES.find((s) => s[0] === id) || SOURCES[0];
/* Preparation hours: SOURCES gives hours per class day for each way of getting materials. A rough guide, not a measurement. */
const seqHours = (u) => seqSrc(u.source)[2] * Math.max(0, u.days || 0);
const seqTotalHours = (c) => sum(c.units.map(seqHours));
const seqHrs = (h) => (h < 10 ? String(Math.round(h * 10) / 10).replace(/\.0$/, '') : String(Math.round(h)));
const seqBufferOk = (c) => Math.max(3, Math.round(availableDays(c) * 0.03));

function seqClean(c) {
  c.units.forEach((u) => { if (!Array.isArray(u.questions)) u.questions = []; if (!u.source || !SOURCES.some((s) => s[0] === u.source)) u.source = 'adopt'; });
  c.goals.forEach((g) => { if (g.unit === '' || (g.unit && !unitOf(c, g.unit))) g.unit = null; });
}

/* ---------- the day budget ---------- */
function seqBudgetHTML(c) {
  const avail = availableDays(c), used = budgetedDays(c), diff = avail - used, total = Math.max(avail, used, 1), pc = (n) => (100 * n / total).toFixed(3) + '%';
  let bar = '<div class="sq-bar" role="img" aria-label="' + esc(used + ' days budgeted of ' + avail + ' available. ' + c.units.map((u, i) => (i + 1) + '. ' + (u.title || 'Untitled') + ', ' + (u.days || 0) + ' days').join('. ') + (used > avail ? '. Over by ' + (used - avail) + ' days.' : '')) + '">';
  c.units.forEach((u, i) => { bar += '<div class="sq-seg s' + (i % 2) + '" style="flex:' + (u.days || 0) + ' 0 0" title="' + esc((i + 1) + '. ' + u.title + ': ' + (u.days || 0) + ' days') + '"><b>' + (i + 1) + '</b><span>' + esc(u.title || 'Untitled') + '</span><i>' + (u.days || 0) + '</i></div>'; });
  if (diff > 0) bar += '<div class="sq-seg spare" style="flex:' + diff + ' 0 0" title="' + diff + ' days of buffer"><span>' + (diff >= total * 0.06 ? 'Buffer' : '') + '</span></div>';
  if (used > avail) bar += '<div class="sq-over" style="left:' + pc(avail) + ';width:' + pc(used - avail) + '"></div>';
  bar += '<div class="sq-last" style="left:' + pc(avail) + '" title="The last day you can plan for"><i>Days available</i></div></div>';
  const ok = seqBufferOk(c), tone = diff < 0 ? 'bad' : diff < ok ? 'warn' : 'good';
  const verdict = diff < 0 ? plural(-diff, 'day') + ' over' : diff === 0 ? 'No buffer' : plural(diff, 'day') + ' of buffer';
  const words = 'Your units add up to <b>' + plural(used, 'class day') + '</b>. The calendar gives you <b>' + avail + '</b> after the ' + plural(c.school.lost || 0, 'day') + ' you set aside for assemblies, drills, testing and weather. ' +
    (diff < 0 ? 'That is <b>' + plural(-diff, 'day') + ' more than you have.' : diff === 0 ? 'That leaves <b>no buffer</b>, and some days will be lost.' : 'That leaves <b>' + plural(diff, 'day') + '</b> of buffer' + (diff < ok ? ', which is thin.' : '.')) + (diff < 0 ? '</b>' : '');
  let cut = '';
  if (diff < 0) {
    const fam = c.goals.filter((g) => g.priority === 'familiar');
    cut = '<div class="sq-cut"><div class="lbl">First to cut: goals marked Worth meeting</div>' + (fam.length
      ? '<div class="chips">' + fam.map((g) => { const u = unitOf(c, g.unit); return '<span class="chip" title="' + esc(g.text) + '">' + esc(short(g.text || 'Untitled goal', 48)) + (u ? ' <i>' + esc(short(u.title, 18)) + '</i>' : '') + '</span>'; }).join('') + '</div><p class="hint">Dropping a goal only saves days when you also shorten the unit it sits in.</p>'
      : '<p class="hint">No goals are marked Worth meeting. Look at the Important ones next, or shorten a unit.</p>') + '</div>';
  }
  return '<div class="sq-stats"><div><span class="lbl">Days budgeted</span><b class="num">' + used + '</b></div><div><span class="lbl">Days available</span><b class="num">' + avail + '</b></div>' +
    '<div><span class="lbl">' + (diff < 0 ? 'Overrun' : 'Buffer left') + '</span><b class="num ' + tone + '">' + Math.abs(diff) + '</b></div><span class="tag ' + tone + '">' + verdict + '</span></div>' + bar + '<p class="sq-words">' + words + '</p>' + cut;
}

/* ---------- units ---------- */
function seqUnitCard(c, u, k) {
  const p = 'unit:' + u.id + ':', src = seqSrc(u.source), mine = unitGoals(c, u.id), free = c.goals.filter((g) => !g.unit);
  const hasLast = mine.some((g) => g.priority === 'lasting');
  const qs = u.questions.map((q, i) => '<div class="row"><input class="field" data-seqq="' + u.id + ':' + i + '" value="' + esc(q) + '" placeholder="A question with no single right answer" aria-label="Question ' + (i + 1) + ' for unit ' + (k + 1) + '"><button class="x" data-act="seqQDel" data-arg="' + u.id + '=' + i + '" aria-label="Remove question ' + (i + 1) + ' from unit ' + (k + 1) + '">×</button></div>').join('');
  const groups = PRIORITIES.map((pr) => { const gs = mine.filter((g) => g.priority === pr[0]); if (!gs.length) return ''; return '<div class="sq-grp"><span class="tag ' + (pr[0] === 'lasting' ? 'ink' : '') + '">' + esc(pr[1]) + '</span><span class="chips">' + gs.map((g) => '<button class="chip" data-act="seqUnplace" data-arg="' + g.id + '" title="' + esc((g.text || 'Untitled goal') + ' (click to take it out of this unit)') + '">' + esc(short(g.text || 'Untitled goal', 44)) + ' ×</button>').join('') + '</span></div>'; }).join('');
  const place = free.length ? '<select class="pick" data-seqgoalto="' + u.id + '" aria-label="Place a goal in unit ' + (k + 1) + '"><option value="">Place a goal here…</option>' + free.map((g) => '<option value="' + g.id + '">' + esc(short((g.text || 'Untitled goal'), 60)) + '</option>').join('') + '</select>' : '<p class="hint">Every goal already has a unit.</p>';
  return '<section class="sq-unit" id="sq-' + u.id + '"><div class="sq-uhead"><span class="sq-n" aria-hidden="true">' + (k + 1) + '</span>' +
    '<input class="field big grow" data-bind="' + p + 'title" value="' + esc(u.title) + '" aria-label="Unit ' + (k + 1) + ' title"><div class="sq-days"><span class="lbl">Days</span>' + a11yStep('Days in unit ' + (k + 1), p + 'days', u.days || 0, 1, 150, 1) + '</div>' +
    '<div class="sq-tools"><button class="btn sm ghost" data-act="seqMove" data-arg="' + u.id + '=-1"' + (k === 0 ? ' disabled' : '') + ' aria-label="Move this unit earlier">↑ Earlier</button><button class="btn sm ghost" data-act="seqMove" data-arg="' + u.id + '=1"' + (k === c.units.length - 1 ? ' disabled' : '') + ' aria-label="Move this unit later">↓ Later</button><button class="btn sm ghost danger" data-act="seqDel" data-arg="' + u.id + '" aria-label="Delete unit ' + (k + 1) + '">Delete</button></div></div>' +
    '<div class="sq-body"><div class="stack"><h3 class="sec-h">Questions that drive this unit</h3><p class="hint">Open questions worth arguing about, with no single right answer. For example: is a virus alive?</p>' + qs +
    '<div><button class="btn sm" data-act="seqQAdd" data-arg="' + u.id + '">+ Add a question</button></div></div>' +
    '<div class="stack"><h3 class="sec-h">Goals in this unit ' + (hasLast || !mine.length ? '' : '<span class="tag warn">No lasting goal</span>') + '</h3>' + (mine.length ? groups : '<p class="hint">No goals placed here yet.</p>') + place + '</div></div>' +
    '<div class="sq-src"><div class="stack"><span class="lbl" id="sq-srcl-' + u.id + '">Where the materials come from</span>' + a11yGroup('sq-srcl-' + u.id, seg(p + 'source', SOURCES.map((s) => [s[0], s[1], s[3]]), u.source)) + '<p class="hint"><b>' + esc(src[1]) + '.</b> ' + esc(src[3]) + '</p>' +
    '<p class="sq-hrs" data-live="seqhrs-' + u.id + '">Your preparation: about <b class="num">' + seqHrs(seqHours(u)) + ' hours</b> <span class="hint">(' + src[2] + ' hours for each class day, times ' + (u.days || 0) + ' days)</span></p></div>' +
    '<div class="stack"><label class="lbl" for="sq-sn-' + u.id + '">Which book, colleague or sites</label>' + field(p + 'sourceNote', u.sourceNote || '', 'id="sq-sn-' + u.id + '" placeholder="Optional"') +
    '<label class="lbl" for="sq-nt-' + u.id + '">Notes to yourself</label>' + area(p + 'note', u.note || '', 'id="sq-nt-' + u.id + '" rows="2" placeholder="Optional"') + '</div></div></section>';
}

function seqTrayHTML(c) {
  const free = c.goals.filter((g) => !g.unit);
  if (!c.goals.length) return '';
  if (!free.length) return '<section class="panel"><h2>Goals not yet placed <small>None. Every goal has a unit.</small></h2></section>';
  const opts = '<option value="">Put in a unit…</option>' + c.units.map((u, i) => '<option value="' + u.id + '">' + esc((i + 1) + '. ' + short(u.title || 'Untitled unit', 34)) + '</option>').join('');
  return '<section class="panel sq-tray"><h2>Goals not yet placed <small>' + free.length + '</small></h2><p class="hint">These goals are not in any unit, so no days are set aside for them. Place each one, or decide it does not belong in the course.</p>' +
    '<div class="sq-trayl">' + free.map((g) => '<div class="sq-tg"><span class="tag ' + (g.priority === 'lasting' ? 'ink' : '') + '">' + esc(optName(PRIORITIES, g.priority) || g.priority) + '</span><span class="sq-tgt" title="' + esc(g.text) + '">' + esc(short(g.text || 'Untitled goal', 90)) + '</span>' +
      (c.units.length ? '<select class="pick" data-sequnitfor="' + g.id + '" aria-label="Put ' + esc('“' + short(g.text || 'Untitled goal', 40) + '”') + ' in a unit">' + opts + '</select>' : '') + '</div>').join('') + '</div></section>';
}

function seqTotalHTML(c) {
  const tot = seqTotalHours(c);
  const by = SOURCES.map((s) => { const us = c.units.filter((u) => u.source === s[0]); return us.length ? '<li><span>' + esc(s[1]) + ' <i>' + plural(us.length, 'unit') + '</i></span><b class="num">about ' + seqHrs(sum(us.map(seqHours))) + ' hours</b></li>' : ''; }).join('');
  return '<div class="sq-tot"><div><span class="lbl">Your preparation hours, whole year</span><b class="num sq-big">about ' + seqHrs(tot) + ' hours</b></div><ul class="sq-by">' + by + '</ul></div>' +
    '<p class="hint">This is a rough estimate, built from typical hours per class day for each way of getting materials. Adjust it to your own pace. Most new teachers need more time in the first year.</p>';
}

VIEWS.sequence = {
  name: 'Sequence',
  render(c) {
    seqClean(c);
    const units = c.units.length ? c.units.map((u, k) => seqUnitCard(c, u, k)).join('') : empty('A unit is a chunk of the course with one big purpose, usually two to six weeks. Add your first one.');
    return '<div class="ws sq"><div class="ws-head"><div class="eyebrow">Chapter 2</div><h1>Scope and sequence</h1>' +
      '<p>Scope is what the course covers. Sequence is the order. You cannot teach everything, so decide what gets the days.</p></div>' +
      '<div class="sq-narrow">' + mentor(MENTOR.sequence(c)) + '</div>' +
      '<section class="panel"><h2>The day budget <small>one segment for each unit</small></h2><div data-live="seqbudget">' + seqBudgetHTML(c) + '</div></section>' +
      '<h2 class="sq-sec">Units, in teaching order</h2><div class="sq-units">' + units + '</div><div><button class="btn pri" data-act="seqAdd">+ Add a unit</button></div>' +
      seqTrayHTML(c) +
      '<section class="panel"><h2>Preparation time <small>a rough estimate</small></h2><div data-live="seqtotal">' + seqTotalHTML(c) + '</div></section></div>';
  },
  after(root) {
    if (seqUI.focusUnit) { const t = root.querySelector('[data-bind="unit:' + seqUI.focusUnit + ':title"]'); seqUI.focusUnit = null; if (t) { t.focus({ preventScroll: true }); t.select(); t.scrollIntoView({ block: 'center' }); } }
    if (seqUI.focusQ) { const t = root.querySelector('[data-seqq="' + seqUI.focusQ + '"]'); seqUI.focusQ = null; if (t) t.focus({ preventScroll: true }); }
  },
};

MENTOR.sequence = (c) => {
  const out = [], avail = availableDays(c), used = budgetedDays(c), diff = avail - used;
  if (!c.units.length) return ['Start with the big chunks of the year. Three to eight units is plenty. Name each by what students will be able to do.'];
  if (diff < 0) out.push('You are ' + plural(-diff, 'day') + ' over. Something has to leave now, at your desk, not in April.');
  else if (diff < seqBufferOk(c)) out.push('There is almost no buffer. Fire drills, snow days and flu will take days. Give yourself some room.');
  const bare = c.units.find((u) => !c.goals.some((g) => g.unit === u.id && g.priority === 'lasting'));
  if (bare && out.length < 2) out.push('“' + esc(short(bare.title || 'Untitled unit', 28)) + '” has no lasting goal. Why is it in the course?');
  if (out.length < 2 && c.units.length >= 2 && c.units.every((u) => u.source === 'build')) out.push('Every unit is set to build it yourself. That is a heavy first year. Which one could you borrow?');
  const loose = c.goals.filter((g) => !g.unit).length;
  if (out.length < 2 && loose) out.push(plural(loose, 'goal') + ' ' + (loose === 1 ? 'has' : 'have') + ' no unit yet. Place ' + (loose === 1 ? 'it' : 'them') + ' or cut ' + (loose === 1 ? 'it' : 'them') + '.');
  if (!out.length) out.push('The budget holds together. Now read each unit’s questions aloud. Would students argue about them?');
  return out.slice(0, 2);
};

/* ---------- actions ---------- */
ACT.seqAdd = (a, c) => { const u = addUnit(c, { title: 'New unit', days: 10 }); seqUI.focusUnit = u.id; };
ACT.seqMove = (a, c) => { const p = a.split('='), i = c.units.findIndex((u) => u.id === p[0]), j = i + +p[1]; if (i < 0 || j < 0 || j >= c.units.length) return; const t = c.units[i]; c.units[i] = c.units[j]; c.units[j] = t; };
ACT.seqDel = (a, c) => {
  const u = unitOf(c, a); if (!u) return false;
  const nl = unitLessons(c, a).length, na = unitAssess(c, a).length, ng = unitGoals(c, a).length;
  openModal('<div class="sq-mod"><h2 id="sq-del-h">Delete “' + esc(short(u.title || 'Untitled unit', 50)) + '”?</h2><p>This unit has ' + plural(u.days || 0, 'day') + ' budgeted. Deleting it also deletes its <b>' + plural(nl, 'lesson') + '</b> and <b>' + plural(na, 'assessment') + '</b>.</p>' +
    '<p class="hint">' + (ng ? plural(ng, 'goal') + ' in this unit stay in your course and move to the tray of goals not yet placed.' : 'No goals are placed in it.') + ' This cannot be undone.</p>' +
    '<div class="foot"><button class="btn" data-act="closeModal">Keep the unit</button><button class="btn pri" data-act="seqDelYes" data-arg="' + a + '">Delete the unit</button></div></div>');
  const keep = document.querySelector('#modal [data-act="closeModal"]'); if (keep) keep.focus({ preventScroll: true });
  return false;
};
ACT.seqDelYes = (a, c) => { closeModal(); removeUnit(c, a); if (App.sel.unit === a) { App.sel.unit = null; App.sel.lesson = null; } toast('Unit deleted.'); };
ACT.seqUnplace = (a, c) => { const g = goalOf(c, a); if (g) g.unit = null; };
ACT.seqQAdd = (a, c) => { const u = unitOf(c, a); if (!u) return; u.questions.push(''); seqUI.focusQ = a + ':' + (u.questions.length - 1); };
ACT.seqQDel = (a, c) => { const p = a.split('='), u = unitOf(c, p[0]); if (u) u.questions.splice(+p[1], 1); };

/* Typing in a question and the two "place a goal" selects are handled here, because data-bind cannot reach inside a list. */
document.addEventListener('input', (ev) => {
  const el = ev.target; if (!el.dataset || el.dataset.seqq == null || !App.c) return;
  const p = el.dataset.seqq.split(':'), u = unitOf(App.c, p[0]); if (u) { u.questions[+p[1]] = el.value; save(); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target; if (!el.dataset || !App.c || !el.value) return;
  if (el.dataset.seqgoalto != null) { const g = goalOf(App.c, el.value); if (g) g.unit = el.dataset.seqgoalto; save(); render(); }
  else if (el.dataset.sequnitfor != null) { const g = goalOf(App.c, el.dataset.sequnitfor); if (g && unitOf(App.c, el.value)) g.unit = el.value; save(); render(); }

/* Chapter 3, Evidence: decide what you would need to see to believe students got there, before any lesson is planned.
   Method fit after Stiggins and Chappuis; level of thinking after Webb (Depth of Knowledge). Both are rules of thumb, worded as such. */
const EV_METHOD_COLOR = { selected: '#62748e', written: '#8b6bb5', performance: '#2e7d4f', personal: '#c9822b' };
const EV_WHY = {
  'skill+selected': 'A multiple-choice test can show what students know. It cannot show that they can do it.',
  'skill+written': 'Writing about a skill is not the same as doing it. Watch students do it.',
  'product+selected': 'Picking answers cannot show that students can make something.',
  'product+personal': 'A conversation leaves nothing behind to judge. Students need to make the thing.',
  'knowledge+performance': 'A big task shows a lot, but a missing fact can hide inside it. Pair it with a quick check of the facts.',
  'reasoning+selected': 'Good questions can show some reasoning, but students never explain how they got there.',
  'knowledge+personal': 'Asking students one at a time shows what they know, but it takes a lot of class time.',
  'product+written': 'Writing can show part of a product. A real task shows more of it.',

const EV_GOOD = { selected: 'Right questions here can sample a lot of facts quickly.', written: 'Students put their thinking on the page where you can read it.', performance: 'Students show you the work itself, which is the closest thing to the real use.', personal: 'You can follow up on the spot and hear how they think.' };

function evUnit(c) { let u = unitOf(c, App.sel.unit); if (!u) { u = c.units[0] || null; App.sel.unit = u ? u.id : null; } return u; }
const evGoalsSorted = (c, uid) => unitGoals(c, uid).slice().sort((a, b) => PRIORITIES.findIndex((p) => p[0] === a.priority) - PRIORITIES.findIndex((p) => p[0] === b.priority));
const evAssessSorted = (c, uid) => unitAssess(c, uid).slice().sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'major' ? -1 : 1));
const evTitle = (a) => a.title || (a.kind === 'major' ? 'Untitled major assessment' : 'Untitled check');
const evEvidenceFor = (c, gid) => c.assess.filter((a) => (a.goals || []).includes(gid));

function evFitWhy(a) {
  if (!a.targets || !a.targets.length) return 'Choose what this is meant to show, and the tool can say whether the method suits it.';
  const f = methodFit(a);
  if (f === 2) return EV_GOOD[a.method] || 'This method suits what you want to see.';
  const worst = a.targets.reduce((w, t) => ((METHOD_FIT[t] || {})[a.method] < (METHOD_FIT[w] || {})[a.method] ? t : w), a.targets[0]);
  return EV_WHY[worst + '+' + a.method] || 'This method shows these targets only partly.';
}
function evLevelVerdict(c, a) {
  const gs = (a.goals || []).map((id) => goalOf(c, id)).filter(Boolean);
  if (!gs.length) return { tone: 'warn', head: 'Not checked', text: 'Pick the goals this gives evidence of. Then the tool can check the level of thinking.' };
  const top = gs.reduce((m, g) => (g.level > m.level ? g : m), gs[0]);
  if (a.level >= top.level) return { tone: 'good', head: 'Reaches the goals', text: 'It asks for ' + optName(LEVELS, a.level).toLowerCase() + ', as much as the hardest goal it claims (' + optName(LEVELS, top.level).toLowerCase() + ').' };
  return { tone: 'bad', head: 'Falls short', text: 'It asks for ' + optName(LEVELS, a.level).toLowerCase() + ', but the goal "' + short(top.text || 'Untitled goal', 50) + '" is set at ' + optName(LEVELS, top.level).toLowerCase() + '.' };
}
function evVerdicts(c, a) {
  const f = methodFit(a), noT = !a.targets || !a.targets.length, lv = evLevelVerdict(c, a);
  const ft = noT ? ['warn', 'Not checked'] : f === 2 ? ['good', 'Strong fit'] : f === 1 ? ['warn', 'Workable'] : ['bad', 'Poor fit'];
  return '<div class="ev-verdicts"><div class="ev-v"><span class="lbl">Method</span>' + tag(ft[1], ft[0]) + '<span>' + esc(evFitWhy(a)) + '</span></div>' +

MENTOR.evidence = (c) => {
  const u = evUnit(c), out = [];
  if (!u) return ['Lay out your units first. Then come back and decide what you would need to see.'];
  const as = unitAssess(c, u.id), maj = as.filter((a) => a.kind === 'major');
  if (!maj.length) out.push('This unit has no big task. Where do students show you they can use the ideas, not just repeat them?');
  const lastingRecall = c.goals.find((g) => g.priority === 'lasting' && g.level >= 2 && evEvidenceFor(c, g.id).length && evEvidenceFor(c, g.id).every((a) => a.level <= 1 || (a.method === 'selected' && a.targets.every((t) => t === 'knowledge'))));
  if (lastingRecall) out.push('A lasting idea is only measured by recall. Remembering it for Friday is not the same as keeping it.');
  if (c.assess.length >= 3 && c.assess.every((a) => a.method === 'selected')) out.push('Every assessment here is a test. A student who can do the thing but tests badly never gets to show you.');
  if (maj.length && !as.some((a) => a.kind === 'minor')) out.push('Nothing would tell you students are lost before the big task. One ten-minute check a week earlier would.');
  const bare = unitGoals(c, u.id).filter((g) => !evEvidenceFor(c, g.id).length);
  if (bare.length && as.length) out.push('Some goals in this unit have nothing that would show them. If you cannot see it, you cannot teach toward it.');
  if (!out.length) out.push(as.length ? 'This holds together. Now ask of each task: could a student get through it without really understanding?' : 'Start with the big task. What is the one thing you most want to see students do?');
  return out.slice(0, 2);
};

  }).join('') + '</div>').join('');
  const labels = groups.map((g) => '<div class="hwv-lab" style="flex:' + g.ds.length + '" title="' + esc(g.u.title) + '"><span>' + esc(g.u.title) + '</span></div>').join('');
  let grid = ''; for (let m = tick; m <= top; m += tick) grid += '<div class="hwv-gl" style="bottom:' + pc(m) + '"><span>' + m + '</span></div>';

MENTOR.calendar = (c) => {
  const M = calModel(c), L = []; if (!M.ok) return ['Pick the first and last day of school, and I will show you the year.'];
  if (!c.units.length) return ['Lay out your units first. Then come back and see where each one lands.'];
  if (M.left < 0) L.push('Your units need ' + plural(-M.left, 'more day') + ' than the year gives you. Trim something now, before the year trims it for you.');
  else if (M.left < 3) L.push('You have almost no buffer. Something always eats a week. Leave yourself a few spare days.');
  else if (M.left > M.avail * 0.25) L.push('You have a lot of open days. Do not fill them all, but check that the big units have enough time.');
  const gap = (a, b) => (dateOf(b) - dateOf(a)) / DAY_MS;
  for (let k = 0; k < c.units.length && L.length < 2; k++) {
    const s = M.spans[k]; if (!s.fits || s.to < s.from) continue;
    const after = M.dates[s.to + 1], title = esc(c.units[k].title || 'Unit ' + (k + 1));
    if (after && gap(M.dates[s.to], after) >= 8) L.push(title + ' ends just before a long break. Students forget over a break, so plan a short review for when they return.');
    else { let cut = -1; for (let i = s.from; i < s.to; i++) if (gap(M.dates[i], M.dates[i + 1]) >= 8) { cut = i; break; } if (cut >= 0) L.push(title + ' runs across a long break. Plan a way to restart it when everyone is back.'); }
  }
  if (L.length < 2 && M.used > 0 && M.planned < M.used * 0.3) L.push('Most of your days are still open. Build the first few weeks of lessons before you worry about the rest.');
  return L.slice(0, 2);
};

/* Chapter 7, Syllabus: the promise to students and families. Form on the left, the real syllabus on the right as a sheet of paper.
   Every top-level name here starts with syl. */
const SYL_WEIGHTS = [['major', 'Major assessments', 'Tests, projects and essays that show what students can do'], ['minor', 'Minor assessments', 'Quizzes and small tasks'], ['homework', 'Homework', 'Work done outside class'], ['participation', 'Participation', 'Taking part in class']];
const sylTotal = (c) => sum(SYL_WEIGHTS.map((w) => +c.syllabus.weights[w[0]] || 0));
/* The printed syllabus has its own title and sections (h1, h2, h3). On this page they sit under the panel heading, so each moves down two levels and the screen keeps one h1. */
const sylShiftHeads = (h) => h.replace(/<(\/?)h([1-3])(?=[\s>])/g, (m, s, n) => '<' + s + 'h' + (+n + 2));
const sylSyllabusDoc = () => DOCS.find((d) => d.id === 'syllabus');

/* How the weights compare with the design: counts of assessments, and whether any homework is graded. */
function sylFacts(c) {
  const W = c.syllabus.weights, major = c.assess.filter((a) => a.kind === 'major').length, minor = c.assess.filter((a) => a.kind === 'minor').length;
  const hws = c.lessons.filter((l) => l.hw && l.hw.min > 0), graded = hws.filter((l) => l.hw.graded && l.hw.graded !== 'no');
  return { W, major, minor, hwNights: hws.length, hwGraded: graded.length, total: sylTotal(c) };
}
function sylCompareHTML(c) {
  const f = sylFacts(c), W = f.W, L = [];
  L.push('Your course has ' + plural(f.major, 'major assessment') + ' and ' + plural(f.minor, 'minor assessment') + '.');
  if (+W.major > 0 && !f.major) L.push('The syllabus gives major assessments ' + W.major + ' percent, but the course has none. Add some under Evidence, or move the weight.');
  if (+W.minor > 0 && !f.minor) L.push('Minor assessments carry ' + W.minor + ' percent, but the course has none.');
  if (+W.homework > 0 && !f.hwGraded) L.push('Homework counts for ' + W.homework + ' percent, but no homework in your lessons is graded. Either grade some of it or move that weight.');
  else if (!(+W.homework > 0) && f.hwGraded) L.push('You graded ' + plural(f.hwGraded, 'homework night') + ' in your lessons, but homework has no weight here. Students will wonder why they are being graded.');

}

MENTOR.syllabus = (c) => {

/* The report: grades, the course label, the fingerprint, the web of ideas after a simulated year, every check, versions, and the packet. */
App.rep = { web: 'now', unit: null, stress: null };
const repBand = (v) => (v == null ? 'none' : v >= 0.55 ? 'strong' : v >= 0.25 ? 'partial' : 'faint');
const REP_BAND_WORD = { strong: 'holding', partial: 'shaky', faint: 'mostly gone', none: 'not seen' };

/* One image for the whole course: a ring per unit, first unit at the centre. Arc color is what students do,
   ring thickness is how much of the time asks for strategic or extended thinking, ticks are major assessments. */
function fingerprintSVG(c, size) {
  const n = Math.max(1, c.units.length), S = size || 360, cx = S / 2, cy = S / 2, r0 = S * 0.09, dr = (S * 0.47 - r0) / n;
  const arc = (r, a0, a1) => { const p = (a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)], A = p(a0), B = p(a1); return 'M' + A[0].toFixed(2) + ' ' + A[1].toFixed(2) + 'A' + r.toFixed(2) + ' ' + r.toFixed(2) + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + B[0].toFixed(2) + ' ' + B[1].toFixed(2); };
  let h = '<svg class="fp" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="Course fingerprint: one ring per unit"><circle cx="' + cx + '" cy="' + cy + '" r="' + (r0 * 0.55).toFixed(1) + '" fill="#17171b"/>';
  c.units.forEach((u, k) => {
    const L = unitLabel(c, u.id), r = r0 + dr * (k + 0.5);
    if (!L.total) { h += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r.toFixed(1) + '" fill="none" stroke="#b9b2a3" stroke-width="1.5" stroke-dasharray="3 5"><title>' + esc(u.title) + ': no lessons planned yet</title></circle>'; return; }
    const w = dr * (0.34 + 0.56 * shares(L).high); let a = -Math.PI / 2;
    for (const F of FAMILIES) { const v = (L.fam[F.id] || 0) / L.total; if (v < 0.004) continue; const b = a + v * Math.PI * 2; h += '<path d="' + arc(r, a + 0.012, Math.max(a + 0.014, b - 0.012)) + '" fill="none" stroke="' + F.color + '" stroke-width="' + w.toFixed(1) + '"><title>' + esc(u.title) + ': ' + F.name.toLowerCase() + ' ' + Math.round(v * 100) + '%</title></path>'; a = b; }
    unitAssess(c, u.id).filter((x) => x.kind === 'major').forEach((x, j, all) => { const t = -Math.PI / 2 + (j + 1) / (all.length + 1) * Math.PI * 2, p = [cx + (r + dr * 0.5) * Math.cos(t), cy + (r + dr * 0.5) * Math.sin(t)]; h += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + Math.max(2, dr * 0.11).toFixed(1) + '" fill="#17171b"><title>' + esc(x.title) + '</title></circle>'; });
  });
  return h + '</svg>';
}
/* The fingerprint in words. */
function fingerprintReading(c, L) {
  if (!L.total) return 'Plan some lessons and your course will start to show its shape.';
  const fams = FAMILIES.filter((f) => f.id !== 'over').map((f) => [f, (L.fam[f.id] || 0) / L.total]).sort((a, b) => b[1] - a[1]), S = shares(L);
  const top = fams[0], low = fams.filter((x) => x[1] < 0.04 && ['talk', 'make', 'practice', 'read', 'revise'].includes(x[0].id)).map((x) => x[0].short.toLowerCase());
  const meth = {}; c.assess.forEach((a) => (meth[a.method] = (meth[a.method] || 0) + (a.kind === 'major' ? 2 : 1))); const mTop = Object.keys(meth).sort((a, b) => meth[b] - meth[a])[0];
  return top[0].short + '-heavy' + (fams[1][1] > 0.12 ? ', with a good deal of ' + fams[1][0].short.toLowerCase() : '') + (low.length ? '; little ' + low.slice(0, 2).join(' or ') : '') + '. Students are active ' + Math.round(S.active * 100) + '% of the time and do the thinking themselves ' + Math.round(S.students * 100) + '% of it.' + (mTop ? ' The evidence leans on ' + optName(METHODS, mTop).toLowerCase() + '.' : '');
}

function webSVG(c, sim) {
  const mode = App.rep.web, cols = c.units.map((u) => ({ u, goals: unitGoals(c, u.id) })).filter((x) => x.goals.length), loose = c.goals.filter((g) => !g.unit || !unitOf(c, g.unit));
  if (loose.length) cols.unshift({ u: null, goals: loose });
  if (!cols.length) return '<p class="hint">No goals yet.</p>';
  const colW = Math.max(92, Math.min(170, 1000 / cols.length)), W = colW * cols.length, rowH = 34, rows = Math.max.apply(null, cols.map((x) => x.goals.length)), H = 46 + rows * rowH, pos = {};
  cols.forEach((col, i) => col.goals.forEach((g, j) => (pos[g.id] = [colW * (i + 0.5) + ((j % 2) - 0.5) * colW * 0.34, 44 + rowH * (j + 0.5)])));
  const gm = goalMap(c);
  /* A goal no lesson or homework touches was never taught: it is drawn hollow, not as forgotten. */
  const val = (g) => { const G = sim && sim.goals[g.id]; if (!G) return null; if (mode !== 'seen' && gm[g.id] && gm[g.id].min + gm[g.id].hwMin < 0.5) return null; return mode === 'seen' ? G.seen : mode === 'now' ? G.recall : G.later ? G.later.recall : G.recall; };
  let h = '<svg class="web" viewBox="0 0 ' + W + ' ' + H + '" style="min-width:' + Math.min(W, cols.length * 110) + 'px;max-width:' + Math.round(W * 1.25) + 'px" role="img" aria-label="Web of ideas">';
  cols.forEach((col, i) => { h += (i % 2 ? '<rect x="' + colW * i + '" y="0" width="' + colW + '" height="' + H + '" fill="rgba(23,23,27,.035)"/>' : '') + '<text class="webcol" x="' + (colW * (i + 0.5)) + '" y="18" text-anchor="middle">' + esc(short(col.u ? col.u.title : 'No unit yet', Math.floor(colW / 7))) + '</text>'; });
  const links = sim && sim.links ? sim.links : c.goals.reduce((a, g) => a.concat(g.after.map((f) => ({ from: g.id, to: f, strength: 0 }))), []);
  for (const k of links) { const a = pos[k.from], b = pos[k.to]; if (!a || !b) continue; const s = mode === 'seen' ? 0 : k.strength || 0, bd = repBand(s); h += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" class="weblink ' + bd + '"><title>How well students connect these two: ' + REP_BAND_WORD[bd] + '</title></line>'; }
  for (const g of c.goals) { const p = pos[g.id]; if (!p) continue; const v = val(g), bd = repBand(v), r = g.priority === 'lasting' ? 11 : g.priority === 'important' ? 8 : 5.5;
    h += '<g class="webdot ' + bd + '"><circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r + '"/>' + (v == null && mode === 'seen' ? '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 3.5).toFixed(1) + '" text-anchor="middle">?</text>' : '') + '<title>' + esc(g.text) + ' — ' + (mode === 'seen' ? (v == null ? 'no assessment looked at this' : 'your assessments would show it as ' + REP_BAND_WORD[bd]) : v == null ? 'not taught in any planned lesson yet' : REP_BAND_WORD[bd]) + '</title></g>'; }
  return h + '</svg>';
}

function repPrint(html, name) { const w = window.open('', '_blank'); if (!w) { download(name + '.html', html, 'text/html'); toast('Pop-ups are blocked, so the packet was downloaded. Open it and print from there.'); return; } w.document.open(); w.document.write(html); w.document.close(); w.focus(); setTimeout(() => { try { w.print(); } catch (e) { /* the user can print from the menu */ } }, 400); }
const repSummary = (c, L, G) => { const S = shares(L); return { active: S.active, together: S.together, high: S.high, hw: L.hw && L.hw.nights ? L.hw.avgNight : 0, days: L.days, serious: App.findings.filter((f) => f.sev >= 2).length, grades: G ? G.areas.map((a) => a.grade) : [] }; };

VIEWS.report = {

  render(c) {

/* The game around the tool: a five-minute warm-up that teaches the one move that matters (change a block, watch the label),

const BANNERS = [

  { id: 'fits', name: 'It fits', how: 'Fit every unit into the year with at least five days to spare.', test: (c) => c.units.length >= 3 && availableDays(c) - budgetedDays(c) >= 5 && budgetedDays(c) >= availableDays(c) * 0.7 },
  { id: 'evidence', name: 'Evidence first', how: 'Give every unit a major assessment.', test: (c) => c.units.length >= 2 && c.units.every((u) => unitAssess(c, u.id).some((a) => a.kind === 'major')) },

  { id: 'bell', name: 'Bell to bell', how: 'Plan a lesson that uses the whole period and still ends before the bell.', test: (c, x) => x.lessons.some((L) => L.total > 0 && L.over <= 0 && L.over >= -0.08 * L.period) },
  { id: 'ten', name: 'Everyone by minute ten', how: 'Plan a lesson where students are active for at least half of the first ten minutes.', test: (c, x) => x.lessons.some((L) => warmActiveBy(L, 10) >= 5) },
  { id: 'voice', name: 'Every voice', how: 'Plan a lesson where a typical student speaks for five minutes.', test: (c, x) => x.lessons.some((L) => L.talk >= 5) },
  { id: 'back', name: 'Brought back', how: 'In one unit, bring earlier learning back from memory on three different days.', test: (c) => c.units.some((u) => unitLessons(c, u.id).filter((l) => l.blocks.some((b) => blockEff(b).retr)).length >= 3) },
  { id: 'unit', name: 'A whole unit', how: 'Plan every day of one unit.', test: (c) => c.units.some((u) => u.days >= 5 && plannedDays(c, u.id) >= u.days) },
  { id: 'intent', name: 'As intended', how: 'Plan a unit of five days or more that meets all three of your own targets.', test: (c) => c.units.some((u) => { const L = unitLabel(c, u.id), S = shares(L); return L.days >= 5 && S.active >= c.intent.active / 100 && S.together >= c.intent.together / 100 && S.high >= c.intent.high / 100; }) },
  { id: 'clean', name: 'Clean sheet', how: 'Have ten days planned and nothing marked to fix.', test: (c, x) => x.days >= 10 && !x.findings.some((f) => f.sev >= 2) },

];
/* Minutes in the first `m` minutes of a lesson in which students are doing more than taking it in. */
function warmActiveBy(L, m) { let a = 0; for (const s of L.segs || []) { if (s.over || s.t0 >= m) continue; const span = Math.min(s.t1, m) - s.t0; let act = 0; for (const code in s.mix) { const ic = icapOf(code, s.e); act += s.mix[code] * ((ic.A || 0) + (ic.C || 0) + (ic.I || 0)); } a += span * act; } return a; }
/* What a starter kit already satisfies when it loads. Those banners are not the teacher's doing, so they are never awarded. */
function bannerBase(c) { const x = { lessons: c.lessons.map((l) => lessonLabel(c, l)), findings: App.findings, days: sum(c.lessons.map((l) => l.days || 1)) }; c.game.base = {}; for (const b of BANNERS) { try { if (b.test(c, x)) c.game.base[b.id] = 1; } catch (e) { /* not met */ } } }

    click('[data-act="hwOn"]'); need(curLesson(c).hw, 'homework not set'); click('[data-act="hwOff"]'); need(!curLesson(c).hw, 'homework not removed');

  });
  step('warm-up can be won', () => {
    ACT.warmup(); const c = App.c, l = curLesson(c); need(c.warm && $('main').querySelector('.warm'), 'no warm-up panel');
    l.blocks = []; [['mini', 12], ['guided', 12], ['indep', 14], ['exit', 4]].forEach((x) => { const b = addBlock(c, l, x[0], x[1]); b.goals = [c.goals[0].id]; }); l.blocks[2].sw = { fb: 'circulate' }; render();

  step('start a course from a kit and from blank', () => {
    App.c = null; go('start'); const begin = () => { ACT.begin(); const b = document.querySelector('#modal [data-act="replaceGo"]'); if (b) b.click(); }; App.setup.subject = 'math'; App.setup.kit = true; App.setup.title = ''; begin(); need(App.c.units.length >= 7 && App.view === 'goals', 'kit course not made'); clean();

    click('#modal [data-act="closeModal"]'); need(loadSaved().title === 'Keep me' && !App.c, 'cancel did not keep the saved course');

  });

    const old = migrate({ v: 7, title: 'Old <b>file</b>', units: [{ id: 'U1', title: 'u' }], goals: [{ id: 'G1', text: 'g', unit: 'U9', kind: 'nonsense' }], lessons: [{ id: 'L1', unit: 'U1', title: 'x', blocks: [{ id: 'B1', move: 'nope', min: 'abc', goals: ['G1', 'G77'], sw: { evil: '<x>' } }] }], assess: [] });
