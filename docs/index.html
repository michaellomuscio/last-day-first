<style>
/* Look: a teacher's desk. Cream paper, black ink, a red pen for the mentor and for problems, a yellow highlighter for what is selected.
   The label borrows the heavy rules of a food label. Activity colors are fixed everywhere (see FAMILIES in 10-codes.js). */
:root {
  --paper: #f3eee3; --card: #fffdf8; --sunk: #e9e2d3; --ink: #17171b; --ink2: #4b4a52; --ink3: #66626d; --line: #d6cdbb; --edge: #8c8474; --line2: #17171b;
  --red: #cf3d27; --hi: #ffe45c; --good: #2e7d4f; --warn: #946000; --bad: #c2331f; --blue: #2d62ad;
  --f-ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif; --f-hand: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  --shadow: 0 1px 0 rgba(23, 23, 27, .08), 0 10px 30px rgba(23, 23, 27, .10); --r: 6px;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: var(--paper); color: var(--ink); font: 400 14.5px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; overflow: hidden }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit }
input, textarea, select { font: inherit; color: inherit }
h1, h2, h3, h4, p { margin: 0 }
[hidden] { display: none !important }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px }
::selection { background: var(--hi) }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) }
.top { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--ink); color: #fff }
.word { font: 900 19px/1 var(--f-ui); font-stretch: 112%; letter-spacing: -.01em; text-transform: uppercase; white-space: nowrap }
.word i { font-style: normal; color: var(--hi) }
.top .title { flex: 1; min-width: 0; font: 600 15px var(--f-ui); background: transparent; border: 0; color: #fff; border-bottom: 1.5px dashed rgba(255, 255, 255, .35); padding: 3px 2px }
.top .title:focus { outline: none; border-bottom: 2.5px solid var(--hi) }
.top :focus-visible { outline-color: var(--hi) }
.top .btn { border-color: rgba(255, 255, 255, .55); color: #fff; background: transparent; box-shadow: none }
.top .btn:hover { background: rgba(255, 255, 255, .14) }
.nav { display: flex; gap: 0; padding: 0 12px; background: var(--card); border-bottom: 2px solid var(--line2); overflow-x: auto; scrollbar-width: none }
.nav::-webkit-scrollbar { display: none }
.nav button { display: flex; align-items: center; gap: 8px; padding: 10px 14px 9px; font: 700 13px var(--f-ui); letter-spacing: .02em; color: var(--ink2); border-bottom: 4px solid transparent; white-space: nowrap }
.nav button:hover { color: var(--ink) }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--red) }
.nav .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 800 11.5px var(--f-ui); border: 2px solid var(--ink3); color: var(--ink3) }
.nav .some .n { border-color: var(--warn); color: var(--warn) }
.nav .done .n { border-color: var(--good); background: var(--good); color: #fff }
.nav .cnt { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font: 800 11px/18px var(--f-ui); text-align: center }
.body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0 }
.body.wide { grid-template-columns: minmax(0, 1fr) }
.main { overflow-y: auto; padding: 22px 26px 60px; min-width: 0 }
.side { overflow-y: auto; border-left: 2px solid var(--line2); background: var(--card); padding: 18px 18px 40px; display: grid; gap: 18px; align-content: start }

/* ---------- pieces every workspace uses ---------- */
.ws { display: grid; gap: 20px; max-width: 1180px }
.ws-head { display: grid; gap: 4px }
.ws-head h1 { font: 900 30px/1.05 var(--f-ui); font-stretch: 110%; letter-spacing: -.02em }
.ws-head p { color: var(--ink2); max-width: 70ch; font-size: 15px }
.eyebrow { font: 800 11.5px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--red) }
.panel { background: var(--card); border: 2px solid var(--line2); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; align-content: start; min-width: 0 }
.panel > h2, .sec-h { font: 800 15px var(--f-ui); letter-spacing: .01em; display: flex; align-items: baseline; justify-content: space-between; gap: 10px }
.panel > h2 small, .sec-h small { font: 500 12.5px var(--f-ui); color: var(--ink3) }
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0 }
.card.sel { border-color: var(--line2); box-shadow: 4px 4px 0 var(--hi) }
.row { display: flex; align-items: center; gap: 10px; min-width: 0 }
.row.between { justify-content: space-between }
.row.wrap { flex-wrap: wrap }
.grow { flex: 1; min-width: 0 }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
.stack { display: grid; gap: 10px; min-width: 0; align-content: start }
.lbl { font: 800 11px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink3) }
.hint { color: var(--ink2); font-size: 13px }
.num { font-variant-numeric: tabular-nums; font-weight: 700 }
.rule { height: 2px; background: var(--line2); border: 0; margin: 2px 0 }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border: 2px solid var(--line2); border-radius: var(--r); background: var(--card); font: 700 13.5px var(--f-ui); white-space: nowrap; box-shadow: 2px 2px 0 var(--line2) }
.btn:hover:not(:disabled) { background: var(--hi) }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none }
.btn.pri { background: var(--ink); color: #fff } .btn.pri:hover:not(:disabled) { background: var(--red) }
.btn.sm { padding: 3px 9px; font-size: 12.5px; border-width: 1.5px; box-shadow: 1.5px 1.5px 0 var(--line2) }
.btn.ghost { border-color: transparent; box-shadow: none; background: transparent; color: var(--ink2) } .btn.ghost:hover:not(:disabled) { background: var(--sunk); color: var(--ink) }
.btn.danger:hover:not(:disabled) { background: var(--bad); color: #fff }
.seg { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--line2); border-radius: var(--r); overflow: hidden; background: var(--card) }
.seg button { padding: 5px 10px; font: 600 13px var(--f-ui); border-right: 1.5px solid var(--line); color: var(--ink2) }
.seg button:last-child { border-right: 0 }
.seg button:hover { background: var(--sunk) }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { padding: 4px 10px; border: 1.5px solid var(--edge); border-radius: 999px; font: 500 13px var(--f-ui); color: var(--ink2); background: var(--card); max-width: 100%; text-align: left }
.chip:hover { border-color: var(--line2) }
.chip.on, .chip[aria-pressed="true"] { background: var(--hi); border-color: var(--line2); color: var(--ink); font-weight: 700 }
.tag { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 3px; font: 800 10.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid currentColor; color: var(--ink3); white-space: nowrap }
.tag.good { color: var(--good) } .tag.warn { color: var(--warn) } .tag.bad { color: var(--bad) } .tag.ink { color: var(--ink) }
.field, .area, .pick { width: 100%; min-width: 0; padding: 7px 9px; border: 1.5px solid var(--edge); border-radius: var(--r); background: #fff }
.field:focus, .area:focus, .pick:focus { outline: 2.5px solid var(--blue); outline-offset: 1px; border-color: var(--line2); box-shadow: 3px 3px 0 var(--hi) }
.area { resize: vertical; min-height: 62px; line-height: 1.4 }
.field.big { font: 800 20px var(--f-ui); border: 0; border-bottom: 2px solid var(--line2); border-radius: 0; background: transparent; padding: 4px 0 }
.step { display: inline-flex; align-items: center; border: 2px solid var(--line2); border-radius: var(--r); overflow: hidden; background: var(--card) }
.step button { width: 28px; height: 30px; display: grid; place-items: center; font: 800 16px var(--f-ui) }
.step button:hover { background: var(--hi) }
.step input { width: 46px; height: 30px; text-align: center; border: 0; border-left: 1.5px solid var(--line); border-right: 1.5px solid var(--line); font: 800 14px var(--f-ui); background: #fff; -moz-appearance: textfield }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none }
input[type="range"] { accent-color: var(--red); width: 100% }
.empty { border: 2px dashed var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 10px; justify-items: start; color: var(--ink2) }
.x { width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; font-size: 17px; color: var(--ink3); flex: none }
.x:hover { background: var(--bad); color: #fff }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none }

/* The mentor writes in the margin, in red pen. */
.mentor { display: grid; gap: 8px; padding: 2px 0 0 14px; border-left: 3px solid var(--red) }
.mentor b { font: 800 11px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: #a12c1a }
.mentor p { font: 500 19px/1.25 var(--f-hand); color: #a12c1a }
.finding { display: grid; gap: 2px; padding: 9px 0; border-top: 1.5px solid var(--line); width: 100%; text-align: left }
.finding:hover { background: var(--sunk) }
.finding b { font-weight: 700; font-size: 13.5px }
.finding span { font-size: 12.5px; color: var(--ink2) }
.finding.s2 b::before { content: "\25CF "; color: var(--bad) } .finding.s1 b::before { content: "\25CF "; color: var(--warn) } .finding.s0 b::before { content: "\25CB "; color: var(--ink3) }
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; pointer-events: none }
.toast { padding: 9px 16px; background: var(--ink); color: #fff; border-radius: var(--r); font-weight: 600; box-shadow: var(--shadow); animation: rise .2s ease-out }
.scrim { position: fixed; inset: 0; background: rgba(23, 23, 27, .55); display: grid; place-items: center; z-index: 40; padding: 16px }
.modal { width: min(720px, 100%); max-height: 100%; overflow-y: auto; background: var(--card); border: 2.5px solid var(--line2); border-radius: var(--r); box-shadow: 8px 8px 0 var(--ink); padding: 22px 24px; display: grid; gap: 14px }
.modal h2 { font: 900 24px/1.1 var(--f-ui); font-stretch: 110%; letter-spacing: -.01em }
.modal .foot { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }

/* ---------- the Learning Facts label ---------- */
.lf { background: #fff; color: #000; border: 2.5px solid #000; padding: 8px 10px 9px; font: 400 12.5px/1.3 var(--f-ui); display: grid; gap: 0; min-width: 0 }
.lf-title { font: 900 30px/1 var(--f-ui); font-stretch: 100%; letter-spacing: -.02em }
.lf-name { font-weight: 700; font-size: 13.5px; margin-top: 2px; overflow-wrap: anywhere }
.lf-serv { font-size: 12.5px }
.lf-bar { height: 10px; background: #000; margin: 5px 0 4px } .lf-bar.mid { height: 5px } .lf-bar.thin { height: 1.5px }
.lf-row { display: flex; justify-content: space-between; gap: 10px; padding: 2.5px 0; border-bottom: 1px solid #000 }
.lf-row i, .lf-head i, .lf-note i { font-style: normal; font-weight: 400; color: #555 }
.lf-row.bad b { color: var(--bad) } .lf-row.warn b { color: var(--warn) }
.lf-head { display: grid; grid-template-columns: 1fr 44px 46px; font-weight: 800; padding: 2px 0; border-bottom: 1px solid #000 }
.lf-head span:nth-child(n+2), .lf-fam span:nth-child(n+2), .lf-int span:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums }
.lf-fam { position: relative; display: grid; grid-template-columns: 1fr 44px 46px; padding: 2.5px 0 4.5px; border-bottom: 1px solid #000 }
.lf-fam span:first-child { display: flex; align-items: center; gap: 6px; font-weight: 600 }
.lf-fam span i { width: 9px; height: 9px; display: inline-block; flex: none }
.lf-fam span:nth-child(3) { font-weight: 800 }
.lf-fam em { position: absolute; left: 0; bottom: 0; height: 2.5px }
.lf-fam.zero { color: #9a9a9a } .lf-fam.zero span i { opacity: .35 }
.lf-stack { display: flex; height: 13px; border: 1.5px solid #000; margin: 2px 0 4px }
.lf-stack i { display: block; height: 100% }
.lf-mix { display: flex; flex-wrap: wrap; gap: 2px 10px; padding-bottom: 4px; border-bottom: 1px solid #000 }
.lf-mix span { display: inline-flex; align-items: center; gap: 4px } .lf-mix i { width: 8px; height: 8px; display: inline-block }
.lf-note { padding: 3px 0; border-bottom: 1px solid #000 }
.lf-note b:first-child { font-weight: 800; margin-right: 4px }
.lf-int { display: grid; grid-template-columns: 1fr 62px 58px; padding: 2.5px 0; border-bottom: 1px solid #000; font-weight: 600 }
.lf-head:has(+ .lf-int) { grid-template-columns: 1fr 62px 58px }
.lf-int span:nth-child(3) { font-weight: 900 }
.lf-int.ok span:nth-child(3)::after { content: " \2713"; color: var(--good) } .lf-int.gap span:nth-child(3) { color: var(--bad) }
.lf-foot { font-size: 11px; color: #444; padding-top: 5px; line-height: 1.3 }
.lf-empty { padding: 14px 0; color: #555 }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.skip { position: absolute; left: 8px; top: -60px; z-index: 60; padding: 8px 12px; background: var(--hi); color: var(--ink); font-weight: 800; border: 2px solid var(--ink); border-radius: var(--r) } .skip:focus { top: 8px }
.main:focus { outline: none }
.side-inline { display: none; max-width: 1180px; margin-top: 24px; padding-top: 18px; border-top: 2px solid var(--line2); gap: 18px }
@media (pointer: coarse), (max-width: 700px) {
  .btn.sm, .chip, .seg button, .x { min-height: 40px } .x { min-width: 40px } .step button { width: 40px; height: 40px } .step input { height: 40px }
  .nav button { min-height: 44px }
}
@media (max-width: 1100px) { .body { grid-template-columns: minmax(0, 1fr) } .side { display: none } .side-inline { display: grid } .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 700px) { .main { padding: 16px 14px 60px } .grid2, .grid3 { grid-template-columns: minmax(0, 1fr) } .top { flex-wrap: wrap; gap: 8px } .top .title { order: 5; flex: 1 1 100% } .ws-head h1 { font-size: 24px } }

.start { max-width: 980px; margin: 0 auto; gap: 26px }
.hero { display: grid; gap: 14px; padding: 18px 0 4px }
.hero h1 { font: 900 clamp(40px, 7vw, 76px)/.95 var(--f-ui); font-stretch: 118%; letter-spacing: -.035em }
.hero h1 i { font-style: normal; background: linear-gradient(transparent 58%, var(--hi) 58%) }
.hero p { font-size: 18px; line-height: 1.45; color: var(--ink2); max-width: 62ch }
.fine { max-width: 80ch }

.ws.lessons { max-width: none }
.lgrid { display: grid; grid-template-columns: 236px minmax(0, 1fr) 372px; gap: 22px; align-items: start }
.lessons-list { display: grid; gap: 12px; position: sticky; top: 0 }
.lcard { text-align: left; gap: 6px; padding: 9px 11px }
.lcard:hover { border-color: var(--line2) }
.mini { display: flex; height: 9px; border: 1.5px solid var(--line2); background: var(--card); overflow: hidden }
.mini i { display: block; height: 100% }
.addl summary { list-style: none; display: inline-flex; cursor: pointer } .addl summary::-webkit-details-marker { display: none }
.addl .card { text-align: left; gap: 2px } .addl .card:hover { border-color: var(--line2); background: var(--hi) }
.editor { gap: 14px }
.strip { position: relative; display: flex; height: 74px; border: 2.5px solid var(--line2); border-radius: var(--r); background: var(--card); overflow: visible }
.blk { height: 100%; min-width: 0; border-right: 2px solid var(--line2); display: grid; align-content: space-between; padding: 6px 7px; color: #fff; text-align: left; overflow: hidden; position: relative }
.blk b { font: 800 12.5px/1.1 var(--f-ui); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.blk i { font: 900 15px/1 var(--f-ui); font-style: normal }
.blocklist { display: none; margin: 0; padding: 0; list-style: none; border: 2px solid var(--line2); border-radius: var(--r); overflow: hidden; background: var(--card) }
.blocklist button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 12px; border-bottom: 1.5px solid var(--line); font-weight: 600 }
.blocklist li:last-child button { border-bottom: 0 } .blocklist button span { flex: 1 } .blocklist button.sel { background: var(--hi) }
.blk:hover { filter: brightness(1.1) }
.blk.sel { outline: 4px solid var(--hi); outline-offset: -4px; box-shadow: inset 0 0 0 2px var(--ink) }
.blk.over { background: repeating-linear-gradient(135deg, #cfc8b8 0 6px, #e9e2d3 6px 12px); padding: 0 }
.blk.spare { background: repeating-linear-gradient(90deg, transparent 0 7px, var(--line) 7px 8px); border-right: 0; padding: 0 }
.bell { position: absolute; top: -9px; bottom: -9px; width: 0; border-left: 3px dashed var(--red); pointer-events: none }
.bell i { position: absolute; top: -13px; left: -14px; font: 800 10px var(--f-ui); font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--red) }
.head { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--ink); left: 0; pointer-events: none; box-shadow: 0 0 0 2px var(--hi) }
.ruler { position: relative; height: 16px; margin-top: 3px }
.ruler span { position: absolute; transform: translateX(-50%); font: 600 10.5px var(--f-ui); color: var(--ink3); font-variant-numeric: tabular-nums }
.insp h2 .dot { width: 12px; height: 12px; margin-right: 4px }
.insp details > summary, .pal details > summary { cursor: pointer; font: 700 12.5px var(--f-ui); color: var(--ink2) }
.palrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 0; border-top: 1.5px solid var(--line) }
.palrow .lbl { padding-top: 6px }
.pal .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 9px }
.observer { position: sticky; top: 0; gap: 10px }
.room { border: 2.5px solid var(--line2); border-radius: var(--r); overflow: hidden; background: #fbf8f0 }
.room canvas { display: block; width: 100%; height: auto }
.roomcap { padding: 6px 10px; border-top: 2px solid var(--line2); background: var(--ink); color: #fff; font-size: 12.5px; min-height: 46px; display: grid; gap: 1px }
.roomcap span { color: #d9d4c7; font-size: 12px }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--ink2) }
.legend span { display: inline-flex; align-items: center; gap: 5px }
@media (max-width: 1250px) { .lgrid { grid-template-columns: 210px minmax(0, 1fr) } .observer { grid-column: 1 / -1; position: static; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start } .observer .room { grid-row: span 3 } }
@media (max-width: 800px) { .blocklist { display: block } .lgrid { grid-template-columns: minmax(0, 1fr) } .lessons-list { position: static } .observer { grid-template-columns: minmax(0, 1fr) } .palrow { grid-template-columns: minmax(0, 1fr) } }

/* Goals: the aim, three columns of goals, the web of ideas, the sorting game.
   Text colors are checked at 4.5 to 1 on the paper, card and tinted backgrounds used here. The root rule below darkens the grey, amber, red and green tokens inside this screen only. */
.ws.gl, .gl-mod { --ink3: #5e5a63; --warn: #8a5700; --red: #b8301c; --bad: #b0301d; --good: #26703f }
.ws.gl { grid-template-columns: minmax(0, 1fr) }
.gl-mod { display: contents }
.ws.gl .panel { grid-template-columns: minmax(0, 1fr) }
.ws.gl .panel > h2 { flex-wrap: wrap }
.a11y-g { display: inline-block; max-width: 100% }
.gl-narrow { display: none }
.gl-aim { border-width: 3px }
.gl-aimh { font: 900 20px/1.1 var(--f-ui); font-stretch: 108%; letter-spacing: -.01em }
.gl-lead { font: 700 16px var(--f-ui); color: var(--ink); border-left: 5px solid var(--hi); padding: 2px 0 2px 10px }

/* Usual US days off for a school year starting in `y`. Editable in the Calendar; a starting point, not a district calendar. */
function defaultDaysOff(y) {
  const out = [], add = (iso) => out.push(iso), range = (a, b) => { for (let d = dateOf(a), e = dateOf(b); d <= e; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) if (d.getDay() % 6) add(isoOf(d)); };
  const nth = (yr, mo, dow, n) => { const d = new Date(yr, mo, 1); let k = 0; while (true) { if (d.getDay() === dow && ++k === n) return isoOf(d); d.setDate(d.getDate() + 1); } };

  const U = {}, unitIdx = {};
  c.units.forEach((u, i) => {
    const ls = unitLessons(c, u.id), L = unitLabel(c, u.id);
    U[u.id] = { u, i, ls, as: unitAssess(c, u.id), gs: unitGoals(c, u.id), L, S: shares(L), span: spanOf[u.id] };
    unitIdx[u.id] = i;
  });
  const lessonDay = {}, assessDay = {}, assessLesson = {};
  for (const d of dayList) {
    if (!d.lesson) continue;
    if (lessonDay[d.lesson.id] == null) {
      lessonDay[d.lesson.id] = d.i;
      for (const b of d.lesson.blocks) if (b.assess && assessDay[b.assess] == null) { assessDay[b.assess] = d.i; assessLesson[b.assess] = d.lesson.id; }
    }
  }
  const plannedAll = CL.days;                                 // lesson days planned across the course
  const built = (x) => x.ls.length || x.as.length || x.gs.length || (x.u.questions || []).some((q) => String(q).trim());
  const LL = {}; c.lessons.forEach((l) => (LL[l.id] = lessonLabel(c, l)));
  const reviewGoals = new Set();
  c.lessons.forEach((l) => { if (l.hw && l.hw.purpose === 'review') (l.hw.goals || []).forEach((g) => reviewGoals.add(g)); });
  const lasting = c.goals.filter((g) => g.priority === 'lasting'), lastingU = lasting.filter((g) => g.kind === 'understanding');
  const isStrongPerf = (a) => a.level >= 3 && (a.method === 'performance' || a.method === 'personal' || (a.method === 'written' && a.rubric && a.rubric !== 'none'));

  /* ============ ALIGNMENT ============ */
  if (hasGoals) {
    // 1. A lasting understanding nothing assesses. Wiggins and McTighe: assessments aligned to every Stage 1 element.
    for (const g of lastingU) if (!GM[g.id].assess.length)
      add('al-lasting-no-assess', 'alignment', 2, 'Nothing is planned to show whether students reach the lasting understanding ' + ckGoal(g) + '.',
        'Without some evidence, you will not know whether the idea you care most about was learned.', { view: 'evidence', unit: g.unit || undefined, goal: g.id }, 'Wiggins and McTighe');

    // 2. Assessment pitched below the goal. Webb: consistency of the level of thinking. Each goal is judged by the best assessment that lists it.
    for (const g of c.goals) {
      const m = GM[g.id]; if (!m.assess.length) continue;
      let best = null; for (const id of m.assess) { const a = assessOf(c, id); if (a && (!best || a.level > best.level)) best = a; }
      if (best && best.level < g.level) add('al-level-below', 'alignment', g.priority === 'familiar' ? 1 : 2,
        'The best assessment of the goal ' + ckGoal(g) + ' is ' + ckQ(ckTrim(best.title, 50)) + ', which asks for ' + LEVEL_NAME[best.level].toLowerCase() + ', while the goal is set at ' + LEVEL_NAME[g.level].toLowerCase() + '.',
        'A task that asks for less thinking than the goal can show less than the goal needs. A smaller check alongside a higher-level task is fine.', { view: 'evidence', unit: best.unit, assess: best.id, goal: g.id }, 'Webb, Depth of Knowledge');
    }
    for (const a of c.assess) {
      // 3. Method against target. Stiggins and Chappuis.
      if (a.targets && a.targets.length && methodFit(a) === 0) {
        const bad = a.targets.find((t) => (METHOD_FIT[t] || {})[a.method] === 0), best = METHODS.filter((m) => METHOD_FIT[bad][m[0]] === 2).map((m) => m[1].toLowerCase());
        add('al-method-fit', 'alignment', 1, ckQ(ckTrim(a.title, 50)) + ' uses ' + ckName(METHODS, a.method) + ' to check ' + ckName(TARGETS, bad) + ', and that method is usually a weak fit for it.',
          'A ' + ckName(TARGETS, bad) + ' target is usually shown more directly by ' + (best.join(' or ') || 'another method') + '.', { view: 'evidence', unit: a.unit, assess: a.id }, 'Stiggins and Chappuis');
      }
    }

    // 4. Assessed but never taught. Only judged where lessons exist to look at.
    for (const g of c.goals) {
      const m = GM[g.id]; if (!m.assess.length || m.min > 0) continue;
      const ls = g.unit && U[g.unit] ? U[g.unit].ls.length : c.lessons.length;
      if (!ls) continue;
      add('al-untaught', 'alignment', g.priority === 'familiar' ? 1 : 2, 'The goal ' + ckGoal(g) + ' is assessed, but no planned lesson teaches it.',
        'Students are being asked to show something the plan has not yet given them time to learn.', { view: 'lessons', unit: g.unit || undefined, goal: g.id }, 'Wiggins and McTighe');
    }

    // 5. Learning time tied to no goal, by unit.
    for (const x of Object.values(U)) {
      const L = x.L; if (!x.ls.length || L.learn <= 0) continue;
      const share = L.orphan / L.learn;
      if (L.orphan >= 10 && share >= 0.15)
        add('al-orphan', 'alignment', share >= 0.25 && L.orphan >= 30 ? 2 : 1, 'In ' + ckUnit(x.u) + ', about ' + ckPct(share) + ' of learning time is tied to no goal.',
          'Time that serves no goal is the easiest place to find room, or to find a goal you have not yet written down.', { view: 'lessons', unit: x.u.id }, 'Wiggins and McTighe');
    }

    // 6. A unit that only takes in. Purpose A, M, T from the observer.
    for (const x of Object.values(U)) {
      const P = x.L.purpose, a = P.A || 0, mt = (P.M || 0) + (P.T || 0);
      if (x.ls.length >= 2 && a >= 60 && mt === 0 && x.gs.some((g) => g.kind === 'understanding'))
        add('al-take-in-only', 'alignment', 1, 'The planned lessons in ' + ckUnit(x.u) + ' are all take in and practise; none of the minutes is aimed at making sense of the idea or using it somewhere new, and the unit has an understanding goal.',
          'Goals about understanding tend to need some time to work out why and to use the idea in a new place, as well as to meet and practise it.', { view: 'lessons', unit: x.u.id }, 'Wiggins and McTighe');
    }

    // 7. Lasting understanding or transfer aim with no strong performance evidence.
    if (c.assess.length && (lastingU.length || String(c.transfer || '').trim()) && !c.assess.some(isStrongPerf))
      add('al-no-performance', 'alignment', 1, 'No assessment is a performance, a conversation or a rubric-marked written task at strategic thinking or above, though the course names ' + (lastingU.length ? 'lasting understandings' : 'a transfer aim') + '.',
        'Using an idea in a new situation is usually shown by a task where students do that, judged against criteria.', { view: 'evidence' }, 'Wiggins and McTighe');
    else if (c.assess.some(isStrongPerf))
      for (const g of lastingU) { const m = GM[g.id]; if (m.assess.length && !m.assess.some((id) => isStrongPerf(assessOf(c, id))))
        add('al-no-performance', 'alignment', 1, 'The lasting understanding ' + ckGoal(g) + ' is assessed, but not by a performance, conversation or rubric-marked written task at strategic thinking or above.',
          'Showing an idea can be used in a new setting usually takes more than recall or short answers; a worth-a-look observation, not a rule.', { view: 'evidence', unit: g.unit || undefined, goal: g.id }, 'Wiggins and McTighe'); }

    // 8. Goals with no unit (only once units exist; summarized when there are many).
    if (hasUnits) {
      const loose = c.goals.filter((g) => !g.unit || !U[g.unit]);
      if (loose.length === 1) add('al-goal-no-unit', 'alignment', 1, 'The goal ' + ckGoal(loose[0]) + ' is not assigned to a unit.', 'A goal with no unit has no place in the sequence, so nothing is planned for it.', { view: 'goals', goal: loose[0].id }, 'Wiggins and McTighe');
      else if (loose.length > 1) add('al-goal-no-unit', 'alignment', 1, plural(loose.length, 'goal') + ' (starting with ' + ckGoal(loose[0]) + ') ' + (loose.length === 1 ? 'is' : 'are') + ' not assigned to a unit.', 'A goal with no unit has no place in the sequence, so nothing is planned for it.', { view: 'goals', goal: loose[0].id }, 'Wiggins and McTighe');
    }

    // 11. Too many lasting goals in one unit, and none at all.
    for (const x of Object.values(U)) {
      const n = x.gs.filter((g) => g.priority === 'lasting').length;
      if (n > 3) add('al-too-many-lasting', 'alignment', 1, ckUnit(x.u) + ' has ' + n + ' lasting goals.',
        'Lasting means worth remembering years from now, and a short list is easier to teach toward. Three or fewer per unit is a rough guide, not a rule.', { view: 'goals', unit: x.u.id }, 'Wiggins and McTighe');
    }
    if (c.goals.length >= 3 && !lasting.length)
      add('al-no-lasting', 'alignment', 1, 'No goal is marked lasting yet.', 'Picking the few ideas worth keeping for life shows where the course should spend its time.', { view: 'goals' }, 'Wiggins and McTighe');
  }

  // 9. Units that are started but missing goals, questions or a major assessment.
  for (const x of Object.values(U)) {
    if (!built(x)) continue;
    const u = x.u, w = { view: 'sequence', unit: u.id };
    if (!x.gs.length && (hasGoals || x.ls.length))
      add('al-unit-no-goals', 'alignment', 1, ckUnit(u) + ' has no goals yet.', 'Without goals there is nothing for the lessons and assessments to line up with.', { view: 'goals', unit: u.id }, 'Wiggins and McTighe');
    if (!(u.questions || []).some((q) => String(q).trim()))
      add('al-unit-no-questions', 'alignment', x.gs.some((g) => g.priority === 'lasting') ? 1 : 0, ckUnit(u) + ' has no guiding questions.', 'A question or two gives students and you a reason to keep coming back to the big idea.', w, 'Wiggins and McTighe');
    if (!x.as.some((a) => a.kind === 'major') && (x.gs.length || x.ls.length))
      add('al-unit-no-major', 'alignment', 1, ckUnit(u) + ' has no major assessment.', 'A culminating task or test is where students show what the unit was for.', { view: 'evidence', unit: u.id }, 'Wiggins and McTighe');
  }

  // 10. A goal built on a goal that is taught later.
  for (const g of c.goals) {
    const gu = g.unit && U[g.unit]; if (!gu) continue;
    for (const pid of g.after || []) {
      const p = goalOf(c, pid), pu = p && p.unit && U[p.unit]; if (!pu) continue;
      let late = pu.i > gu.i;
      if (!late && pu.i === gu.i) { const a = GM[g.id].days[0], b = GM[pid].days[0]; late = a != null && b != null && b > a; }
      if (late) { add('al-order', 'alignment', pu.i > gu.i ? 2 : 1, 'The goal ' + ckGoal(g) + ' builds on ' + ckGoal(p) + ', which is taught ' + (pu.i > gu.i ? 'in a later unit' : 'later in the same unit') + '.',
        'Students are asked to build on something they have not met yet.', { view: 'sequence', unit: g.unit, goal: g.id }, 'Wiggins and McTighe'); break; }
    }
  }

  /* ============ EVIDENCE ============ */
  if (c.assess.length >= 3) {
    const m0 = c.assess[0].method;
    if (c.assess.every((a) => a.method === m0))
      add('ev-single-method', 'evidence', 1, 'All ' + c.assess.length + ' assessments use the same method (' + ckName(METHODS, m0) + ').',
        'Different goals are shown best in different ways, so relying on one method can hide what some students know.', { view: 'evidence' }, 'Stiggins and Chappuis');
  }
  const W = c.syllabus.weights || {}, wt = (W.major || 0) + (W.minor || 0) + (W.homework || 0) + (W.participation || 0);
  if (wt !== 100) add('ev-weights-total', 'evidence', 1, 'The grading weights add up to ' + wt + ', not 100.', 'Students and families read the weights as percentages of the grade.', { view: 'syllabus' }, 'Brookhart and colleagues, clear criteria');
  else if ((W.homework || 0) + (W.participation || 0) > (W.major || 0) + (W.minor || 0))
    add('ev-weights-homework', 'evidence', 1, 'Homework and participation together count for more of the grade (' + ((W.homework || 0) + (W.participation || 0)) + '%) than tests and tasks (' + ((W.major || 0) + (W.minor || 0)) + '%).',
      'Teachers disagree about how much practice work should count; the more it does, the less the grade says about what students can show on their own.', { view: 'syllabus' }, 'Guskey and others, a disputed question');

  /* ============ FEASIBILITY ============ */
  if (hasUnits) {
    const avail = availableDays(c), budget = budgetedDays(c);
    if (budget > avail)
      add('fe-days-over', 'feasibility', 2, 'The units add up to ' + budget + ' class days, but the calendar has about ' + avail + ' to plan with.', 'The last ' + plural(budget - avail, 'day') + ' of the plan will not happen unless something is cut or shortened.', { view: 'calendar' }, 'Your own calendar');
    else if (budget > 0 && c.units.length >= 2 && avail - budget < Math.max(3, Math.round(avail * 0.03)))
      add('fe-no-buffer', 'feasibility', 1, 'The units use ' + budget + ' of ' + avail + ' available days, leaving ' + (avail - budget === 0 ? 'no spare day' : plural(avail - budget, 'spare day')) + '.',
        'Schools lose days to things nobody planned; a few spare days are worth a look.', { view: 'calendar' }, 'Your own calendar');
  }
  for (const x of Object.values(U)) {
    const u = x.u, planned = x.L.days;
    if (u.days > 0 && planned > u.days)
      add('fe-unit-overplanned', 'feasibility', 2, ckUnit(u) + ' has ' + planned + ' days of lessons planned, but only ' + u.days + ' budgeted.', 'Either the unit needs more days or some of the lessons will not fit.', { view: 'sequence', unit: u.id }, 'Your own calendar');
    if (x.L.overDays > 0) {
      let worst = null, count = 0, blocks = 0;
      for (const l of x.ls) { const o = LL[l.id].over; if (o > 0.5) { count++; if (LL[l.id].planned > c.school.period + 0.5) blocks++; if (!worst || o > worst.o) worst = { l, o }; } }
      if (worst) add('fe-lesson-over', 'feasibility', blocks ? 2 : 1,
        blocks ? (count === 1 ? ckQ(ckTrim(worst.l.title, 50)) + ' has more minutes of blocks planned than the period holds.' : plural(blocks, 'lesson') + ' in ' + ckUnit(u) + ' have more minutes of blocks planned than the period holds; the longest overrun is in ' + ckQ(ckTrim(worst.l.title, 40)) + '.')
          : (count === 1 ? ckQ(ckTrim(worst.l.title, 50)) + ' may run past the bell once settling in and moving are counted.' : plural(count, 'lesson') + ' in ' + ckUnit(u) + ' may run past the bell once settling in and moving are counted; the closest call is ' + ckQ(ckTrim(worst.l.title, 40)) + '.'),
        blocks ? 'The blocks you planned do not fit in the period.' : 'The setup and moving times are estimates, so treat this as worth a look rather than a certainty.', { view: 'lessons', unit: u.id, lesson: worst.l.id }, 'Your own plan');
    }
    for (const a of x.as) {
      if (a.kind !== 'major') continue;
      if (!(a.min > 0) && !(a.out > 0))
        add('fe-assess-no-minutes', 'feasibility', 1, ckQ(ckTrim(a.title, 50)) + ' is a major assessment that takes no time in or out of class.', 'Every major assessment needs some time from students, so a zero here is likely a gap.', { view: 'evidence', unit: u.id, assess: a.id }, 'Your own plan');
      else if (a.min > 0 && x.ls.length && assessDay[a.id] == null && u.days > 0 && planned >= u.days)
        add('fe-assess-no-time', 'feasibility', 1, ckQ(ckTrim(a.title, 50)) + ' needs ' + a.min + ' minutes in class, but no lesson has a block for it, and the unit\u2019s days are fully planned.', 'The time has to come from somewhere, and it is easier to find now than the week before.', { view: 'lessons', unit: u.id, assess: a.id }, 'Your own plan');
    }
  }

  /* ============ PRACTICE AND FEEDBACK ============ */
  for (const x of Object.values(U)) {
    const L = x.L, u = x.u, w = { view: 'lessons', unit: u.id };
    const quiet = sum(x.ls.map((l) => (LL[l.id].show < 2 ? l.days || 1 : 0)));
    if (L.days >= 3 && (L.show < 1 || quiet > L.days / 2))
      add('pr-no-show', 'practice', L.show < 1 ? 2 : 1, L.show < 1 ? 'In ' + ckUnit(u) + ', the planned lessons have no time where students show what they know along the way.' : 'In ' + ckUnit(u) + ', more than half of the planned days have under two minutes where students show what they know.', 'Short checks tell you and the students where things stand while there is still time to adjust.', w, 'Rosenshine');
    else if (L.days >= 4 && L.show >= 10 && x.S.fed < 0.15)
      add('pr-show-late-fb', 'practice', 1, 'In ' + ckUnit(u) + ', students show what they know, but almost none of it gets feedback during the lesson.', 'Feedback is easiest to use when it comes while students can still change their answer.', w, 'Black and Wiliam');
    // Group project time with roles left loose. Slavin; Johnson and Johnson: moderately supported.
    let loose = 0; for (const l of x.ls) for (const b of l.blocks) { const m = MOVE_BY[b.move]; if (m && (m.sw || []).some((q) => q.id === 'acct') && (b.sw && b.sw.acct) !== 'roles') loose += b.min * (l.days || 1); }
    if (loose >= 30) add('pr-group-loose', 'practice', 1, 'In ' + ckUnit(u) + ', about ' + Math.round(loose) + ' minutes of group project time leave roles to the team, so no student has a piece they answer for.',
      'Group work seems to help most when the group has a shared goal and each student answers for a part; the evidence is moderate, so this is worth a look.', w, 'Slavin; Johnson and Johnson');
    // Practised once, never brought back, in a unit long enough to forget it. Spacing gaps are weak: stated as a look.
    if (u.days >= 10 && x.span) {
      const gone = x.gs.filter((g) => { const m = GM[g.id]; return g.priority !== 'familiar' && m.min > 0 && m.days.length === 1 && !m.retr && !reviewGoals.has(g.id) && x.span.to - m.days[0] >= 5; });
      if (gone.length) add('pr-practiced-once', 'practice', gone.some((g) => g.priority === 'lasting') ? 1 : 0,
        (gone.length === 1 ? 'The goal ' + ckGoal(gone[0]) + ' is' : plural(gone.length, 'goal') + ', including ' + ckGoal(gone[0]) + ', are') + ' taught on one day in ' + ckUnit(u) + ' and not brought back.',
        'Learning that is not brought back from memory a few days later tends to fade; no particular gap is known to be best.', { view: 'lessons', unit: u.id, goal: gone[0].id }, 'Cepeda and colleagues');
    }
    // Minor checks before the major assessment.
    if (x.as.some((a) => a.kind === 'major') && !x.as.some((a) => a.kind === 'minor') && x.ls.length)
      add('pr-no-minor', 'practice', 1, ckUnit(u) + ' goes to its major assessment with no smaller check before it.', 'A short check along the way is a chance to practise and to learn what to reteach.', { view: 'evidence', unit: u.id }, 'Stiggins and Chappuis');
    // Feedback returned too late to use.
    for (const a of x.as) {
      const day = assessDay[a.id]; if (day == null || a.fb === 'none' || !x.span) continue;
      const left = x.span.to - day;
      const late = a.kind === 'minor' ? a.back >= 2 && a.back > left : a.back >= 4 && a.back > left && !a.retake;
      if (late) add('pr-late-feedback', 'practice', 1, ckQ(ckTrim(a.title, 50)) + ' comes back after ' + plural(a.back, 'day') + ', with ' + (left > 0 ? plural(left, 'day') : 'no days') + ' left in the unit.',
        'Feedback that arrives after the unit has ended is harder for students to act on' + (a.kind === 'major' ? ', unless a retake is offered.' : '.'), { view: 'evidence', unit: u.id, assess: a.id }, 'Black and Wiliam');
    }
  }
  // Homework, course-wide.
  const hwL = c.lessons.filter((l) => l.hw && l.hw.min > 0);
  const hwNew = [], hwNone = [];
  for (const l of hwL) {
    const h = l.hw, d0 = lessonDay[l.id];
    const fresh = h.purpose === 'prepare' || (h.purpose === 'practice' && (h.goals || []).some((g) => GM[g] && d0 != null && GM[g].days[0] != null && GM[g].days[0] >= d0));
    if (h.graded === 'accuracy' && fresh) hwNew.push(l);
    if (h.fb === 'none') hwNone.push(l);
  }
  if (hwNew.length) add('hw-accuracy-new', 'practice', 1, plural(hwNew.length, 'homework task') + ' (first: ' + ckQ(ckTrim(hwNew[0].title, 40)) + ') ' + (hwNew.length === 1 ? 'is' : 'are') + ' graded for accuracy on material students are meeting for the first time, which is worth a look.',
    'Whether to grade first attempts for accuracy is a judgment call; some teachers grade for completion at first.', { view: 'homework', unit: hwNew[0].unit, lesson: hwNew[0].id }, 'Common practice advice; the research on this is thin');
  if (hwNone.length) add('hw-no-feedback', 'practice', hwNone.length >= 3 ? 1 : 0, plural(hwNone.length, 'homework task') + ' (first: ' + ckQ(ckTrim(hwNone[0].title, 40)) + ') ' + (hwNone.length === 1 ? 'gets' : 'get') + ' no feedback of any kind.',
    'Whether homework needs any response is a judgment call; a quick look or a go-over in class is one option.', { view: 'homework', unit: hwNone[0].unit, lesson: hwNone[0].id }, 'Common practice advice; the research on this is thin');

  /* ============ WORKLOAD ============ */
  const limit = c.intent && c.intent.hw;
  if (limit != null && limit >= 0) {
    const over = hwL.filter((l) => l.hw.min > limit);
    if (over.length) {
      over.sort((a, b) => b.hw.min - a.hw.min); const worst = over[0], nights = sum(over.map((l) => l.days || 1));
      add('wl-hw-over', 'workload', worst.hw.min >= limit * 1.5 ? 2 : 1, plural(nights, 'night') + ' of homework ask for more than your own limit of ' + limit + ' minutes; the longest is ' + worst.hw.min + ' minutes (' + ckQ(ckTrim(worst.title, 40)) + ').',
        'You set that limit yourself, so this is where the plan and your own limit differ.', { view: 'homework', unit: worst.unit, lesson: worst.id }, 'Your own intent');
    }
  }
  {
    const dev = hwL.filter((l) => l.hw.device), nights = sum(hwL.map((l) => l.days || 1)), dn = sum(dev.map((l) => l.days || 1));
    if (dev.length) add('wl-hw-device', 'workload', dn >= 3 || dn / (nights || 1) >= 0.3 ? 1 : 0, plural(dn, 'night') + ' of homework need a device or internet (first: ' + ckQ(ckTrim(dev[0].title, 40)) + ').',
      'Some students may not have reliable access at home, so class time or another way in is worth a look.', { view: 'homework', unit: dev[0].unit, lesson: dev[0].id }, 'Your own plan');
  }

  /* ============ INTENT ============ */
  if (plannedAll >= 3 && CL.learn > 0) {
    const S = shares(CL), I = c.intent || {};
    const rows = [['in-active', 'active', 'Students are active (working with the material or making something) in', 'in', 'active', 'a share of planned class time'],
      ['in-together', 'together', 'Students work in pairs or groups for', 'in', 'together', 'a share of learning time'],
      ['in-high', 'high', 'Learning time at strategic or extended thinking is', 'in', 'high', 'a share of learning time']];
    for (const r of rows) {
      const key = r[1], target = (I[key] || 0) / 100, have = S[key];
      if (have + 0.05 + 1e-9 >= target) continue;
      let low = null; for (const x of Object.values(U)) if (x.L.days >= 3 && x.L.learn > 0 && (!low || x.S[key] < low.S[key])) low = x;
      const many = Object.values(U).filter((x) => x.L.days >= 3).length >= 2;
      const txt = key === 'active' ? 'About ' + ckPct(have) + ' of planned class time has students active, against your aim of ' + ckPct(target) + '.'
        : key === 'together' ? 'About ' + ckPct(have) + ' of learning time has students working in pairs or groups, against your aim of ' + ckPct(target) + '.'
        : 'About ' + ckPct(have) + ' of learning time is at strategic or extended thinking, against your aim of ' + ckPct(target) + '.';
      add(r[0], 'intent', 1, txt.replace(/^About/, 'Your plan and your aim differ: about') + (many && low ? ' ' + ckUnit(low.u) + ' is furthest below, at ' + ckPct(low.S[key]) + '.' : ''),
        'This only compares the plan with what you said you want; it does not say which is better.', { view: 'lessons', unit: many && low ? low.u.id : undefined }, 'Your own intent');
    }
  }

  out.forEach((f, i) => (f._o = i));
  out.sort((a, b) => b.sev - a.sev || a._o - b._o);
  out.forEach((f) => delete f._o);
  return out;
}

/* How much of the course exists, 0..1: goals 10%, units with days 10%, units with an assessment 10%,
   lesson days planned against days budgeted 50%, lessons with homework 5%, syllabus 15%. */
function ckBuilt(c) {
  const nU = c.units.length, budget = budgetedDays(c), planned = sum(c.lessons.map((l) => l.days || 1)), S = c.syllabus || {};

/* A plausible year of lost days (weather, assemblies, a drill, testing), picked from the seed. */

      goals: [
        { key: 'dbU1', text: 'Testing can show that a bug exists but almost never that there are none, because there are too many possible inputs to try them all, so good tests are chosen to break the code at its edges, and debugging means forming a guess about the cause and testing that guess instead of changing things at random.', kind: 'understanding', priority: 'lasting', level: 3, after: ['coS1', 'fnU1'] },
        { key: 'dbK1', text: 'Three kinds of errors: syntax errors (the code is not valid Python and will not run), runtime errors (the program stops with an exception such as ZeroDivisionError, ValueError or IndexError) and logic errors (it runs but gives the wrong answer).', kind: 'knowledge', priority: 'important', level: 2, after: ['alS2'] },

    { key: 'data', title: 'Lists, strings and dictionaries', days: 22, source: 'curate',

      goals: [
        { key: 'dsU1', text: 'How you organize data decides how easy a problem is to solve and how fast the program runs: the right structure often turns a long tangled program into a short one, and finding a key in a dictionary takes about the same time however many entries it holds, while searching a list takes longer as the list grows.', kind: 'understanding', priority: 'lasting', level: 3, after: ['fnU1', 'lpU1'] },
        { key: 'dsK1', text: 'Lists and strings are ordered and indexed from 0, and can be sliced (s[1:4] gives positions 1, 2 and 3, and s[-1] is the last item); lists can be changed after they are made, strings cannot, and giving a list a second name does not copy it, so a change through either name shows through both.', kind: 'knowledge', priority: 'important', level: 2, after: ['lpK1', 'alK1'] },
        { key: 'dsK2', text: 'A dictionary stores key and value pairs that you look up by key, each key appears only once, and a key must be a value that cannot change, such as a string, a number or a tuple, not a list.', kind: 'knowledge', priority: 'important', level: 2, after: ['dsK1'] },

        { key: 'btK1', text: 'Binary place values (1, 2, 4, 8, 16 and so on), the fact that n bits make 2 to the power n different patterns (8 bits make 256), and how to convert between binary and decimal.', kind: 'knowledge', priority: 'important', level: 2, after: ['alK1'] },
        { key: 'btK2', text: 'Text is stored as numbers by an encoding such as ASCII or Unicode; a pixel is stored as red, green and blue values from 0 to 255; and compression makes files smaller either by describing repeated patterns more briefly, so nothing is lost (lossless), or by discarding detail people are unlikely to notice (lossy).', kind: 'knowledge', priority: 'important', level: 2, after: ['btK1', 'dsK1'] },

        { key: 'nuK1', text: 'The nutrients (carbohydrate, protein, fat, vitamins, minerals and water), what a Calorie measures, why teenagers, who are still growing, need regular meals and enough food, and the food groups in the current federal Dietary Guidelines for Americans (the graphic has changed more than once, so use the current one). Any worry about eating or body image is a reason to talk to a trusted adult or a doctor.', kind: 'knowledge', priority: 'important', level: 2, after: [] },

    { key: 'mind', title: 'Stress, sleep and mental health', days: 20, source: 'build',
      questions: ['When is stress useful and when is it harmful?', 'Why is it hard to ask for help, and what would make it easier?'],
      goals: [
        { key: 'msU1', text: 'Everyone’s mood goes up and down, mental health is part of health like any other, and noticing early signs in yourself and others and asking for help is a skill and a strength.', kind: 'understanding', priority: 'lasting', level: 3, after: ['inK1'] },
        { key: 'msU2', text: 'Stress is a normal response that helps in short bursts and wears the body down when it never lets up, so what you do after you notice it matters more than whether you feel it.', kind: 'understanding', priority: 'lasting', level: 3, after: ['msK1'] },
        { key: 'msK1', text: 'The stress response (the body releases adrenaline and cortisol to prepare to fight, flee or freeze), and how sleep works: teens need about 8 to 10 hours, and their body clocks shift later during adolescence.', kind: 'knowledge', priority: 'important', level: 2, after: ['inK1'] },
        { key: 'msK2', text: 'Common signs that a problem needs more than self-care: it lasts for weeks, interferes with school, sleep, eating or friends, or includes thoughts of self-harm or suicide, which always mean getting help right away. These are warning signs, not a diagnosis, and they are taught with safe-messaging guidance (no methods or details).', kind: 'knowledge', priority: 'important', level: 2, after: ['msK1'] },
        { key: 'msS1', text: 'Try several coping strategies (slow breathing, movement, writing, talking, planning), keep a private record of what helps you and choose a few that work.', kind: 'skill', priority: 'important', level: 3, after: ['ftS2', 'msU2'] },
        { key: 'msS2', text: 'Help a friend who is struggling by listening, not promising secrecy when safety is at risk, and getting a trusted adult; know where to turn, including a school counselor, a doctor and the 988 Suicide and Crisis Lifeline (call, text or chat 988 in the United States), and 911 if someone is in immediate danger.', kind: 'skill', priority: 'important', level: 3, after: ['msK2', 'msU1'] }

    { key: 'rel', title: 'Relationships, boundaries and sexual health', days: 18, source: 'curate',
      questions: ['How can you tell the difference between caring and controlling?', 'What do you need to know about your body, and who can you ask?'],
      goals: [
        { key: 'rlU1', text: 'In any relationship, friend, family or dating, health rests on respect, honest talk and each person’s right to set limits, and consent means a clear, free yes that either person can take back at any time and that cannot be given by someone who is pressured, asleep, intoxicated or too young under the law.', kind: 'understanding', priority: 'lasting', level: 3, after: ['rlK1'] },
        { key: 'rlU2', text: 'It is easier to hold to your own values and limits when you have thought them through before the moment arrives.', kind: 'understanding', priority: 'important', level: 3, after: ['inU2'] },
        { key: 'rlK1', text: 'What separates healthy, unhealthy and abusive relationships, including controlling behavior and online pressure, and the fact that sharing sexual images of anyone under 18 can break the law as well as hurt people; if an image is shared without consent, the step is to tell a trusted adult.', kind: 'knowledge', priority: 'important', level: 2, after: ['inK1'] },
        { key: 'rlK2', text: 'Medically accurate facts, in line with your district’s curriculum, about how pregnancy and sexually transmitted infections happen and how risk is reduced: abstinence is the only method that is fully effective, condoms used correctly every time lower the risk of both, other methods of birth control work to different degrees, testing and treatment are available, and vaccines prevent some infections such as HPV and hepatitis B. Check what your state allows.', kind: 'knowledge', priority: 'important', level: 2, after: [] },
        { key: 'rlS1', text: 'Say what you want and do not want clearly and calmly, using “I” statements, and respond respectfully when someone else sets a limit.', kind: 'skill', priority: 'important', level: 3, after: ['rlU1'] },
        { key: 'rlS2', text: 'Find reliable and confidential help for questions about health and relationships (a school counselor or nurse, a doctor, a trusted adult, a reputable health site).', kind: 'skill', priority: 'important', level: 3, after: ['inS1', 'msS2'] }

    { key: 'sub', title: 'Alcohol, tobacco, vaping and other drugs', days: 16, source: 'curate',

      goals: [
        { key: 'sbU1', text: 'How a substance affects a person depends on what it is, how much and how often it is used, and who is using it, and a teenage brain that is still developing is more open to harm and to addiction, so deciding ahead of time what you will do protects you.', kind: 'understanding', priority: 'lasting', level: 3, after: ['inU2', 'rlU2'] },
        { key: 'sbK1', text: 'What nicotine, alcohol, cannabis, opioids and misused prescription drugs do to the body; that vapes deliver nicotine and other chemicals and are not just water vapor; that counterfeit pills can contain fentanyl; and that most teenagers do not use these substances.', kind: 'knowledge', priority: 'important', level: 2, after: [] },
        { key: 'sbK2', text: 'Addiction is a condition that changes the brain’s reward and control systems, which is why stopping is hard, why treatment works better than blame and why recovery is possible.', kind: 'knowledge', priority: 'important', level: 2, after: ['sbK1', 'msK2'] },

    { key: 'safe', title: 'Safety and first aid', days: 14, source: 'curate',

        { key: 'sfK1', text: 'The steps of hands-only CPR for an adult or teen who suddenly collapses: check the scene and whether the person responds and breathes normally, call 911, push hard and fast in the center of the chest (100 to 120 pushes a minute, about 2 inches deep) and use an AED as soon as one arrives.', kind: 'knowledge', priority: 'important', level: 2, after: [] },

      goals: [
        { key: 'rev-u1', text: 'The American Revolution grew out of disputes over who had the right to tax and govern, and its leaders justified it with ideas of natural rights that the new nation applied unevenly, leaving a gap between its ideals and its practice.', kind: 'understanding', priority: 'lasting', level: 3, after: ['col-u2'] },

        { key: 'rev-k1', text: 'The French and Indian War and the new taxes, the Stamp Act, Common Sense, the Boston Massacre and Tea Party, Lexington and Concord, the Declaration of Independence, Saratoga and Yorktown, the Articles of Confederation, Shays’ Rebellion, the Convention’s compromises (the Great Compromise and the three-fifths clause), the Federalist Papers, the Bill of Rights, Hamilton’s and Jefferson’s competing visions and the first political parties.', kind: 'knowledge', priority: 'important', level: 1, after: ['col-k1'] },

        role: 'A delegate to the Constitutional Convention, such as Madison, Sherman, Mason or Gouverneur Morris', audience: 'The other delegates, played by classmates', product: 'A two-page position paper and a three-minute speech on one question the Convention had to settle (how states are represented, how slavery is counted, or how strong the executive should be), weighing why the Articles of Confederation failed and how your choice squares with the principles of the Declaration' },

    { key: 'wst', title: 'Expansion, Reform and Slavery, 1800 to 1860', days: 20, source: 'curate',
      questions: ['Who benefited from the nation’s growth, and who paid for it?', 'How do people use a country’s own ideals to ask it to change?'],
      goals: [
        { key: 'wst-u1', text: 'Growth in land, markets and voters brought opportunity to many, but the same expansion deepened slavery and removed Native nations from their land, and the conflict over slavery grew with the country.', kind: 'understanding', priority: 'lasting', level: 3, after: ['rev-u1', 'col-u2'] },
        { key: 'wst-u2', text: 'Reform movements such as abolition, women’s rights and temperance show citizens using the nation’s own ideals to demand change, and they met organized resistance.', kind: 'understanding', priority: 'lasting', level: 3, after: ['rev-u1'] },
        { key: 'wst-k1', text: 'The Louisiana Purchase, Marbury v. Madison, the War of 1812, the Erie Canal and the market revolution, the cotton gin and the growth of slavery, Jacksonian democracy, the Indian Removal Act and the Trail of Tears, the Missouri Compromise, the Second Great Awakening, Seneca Falls, Texas and the Mexican-American War, and the Compromise of 1850.', kind: 'knowledge', priority: 'important', level: 1, after: ['rev-k1'] },

    { key: 'civ', title: 'Civil War and Reconstruction, 1850 to 1877', days: 20, source: 'curate',
      questions: ['What made compromise impossible in 1860?', 'What did freedom mean in 1865, and who decided?'],
      goals: [
        { key: 'civ-u1', text: 'The states that seceded gave their reasons in their own declarations, and those documents put the defense of slavery at the center; disputes over federal power, economics and party politics shaped how and when the conflict came, and historians weigh them against that evidence.', kind: 'understanding', priority: 'lasting', level: 3, after: ['wst-u1'] },
        { key: 'civ-u2', text: 'Reconstruction tried to rebuild the nation and to define freedom and citizenship through the 13th, 14th and 15th Amendments, and its limited and contested results shaped American life long after 1877.', kind: 'understanding', priority: 'lasting', level: 3, after: ['civ-u1', 'rev-u1'] },
        { key: 'civ-k1', text: 'The Fugitive Slave Act, the Kansas-Nebraska Act and Bleeding Kansas, John Brown, Dred Scott, the Lincoln-Douglas debates, the election of 1860, secession, Antietam and the Emancipation Proclamation, Gettysburg, Appomattox, Lincoln’s assassination, the Freedmen’s Bureau, the Black Codes, Johnson’s impeachment, the Reconstruction Amendments, and the end of Reconstruction in 1877.', kind: 'knowledge', priority: 'important', level: 1, after: ['wst-k1'] },

        role: 'The host of a history podcast', audience: 'Listeners who know the war but not Reconstruction', product: 'A ten-minute episode and transcript on the question "What did freedom mean to formerly enslaved people between 1865 and 1870, and who decided?", using at least four primary sources such as the January 1865 meeting with General Sherman, the Mississippi Black Codes and the 14th Amendment' },
      minors: [

        { title: 'The declarations in their own words: an annotated comparison', method: 'performance', targets: ['reasoning', 'product'], level: 3, goals: ['civ-u1', 'civ-s1'], min: 25, fb: 'comments' },

    { key: 'ind', title: 'Industrial America and Progressive Reform, 1877 to 1914', days: 22, source: 'curate',
      questions: ['Was the Gilded Age an age of progress?', 'What should government do about problems that markets create?'],
      goals: [
        { key: 'ind-u1', text: 'Industrialization created new wealth, new kinds of work and new cities, and it also created new inequality, so Americans disagreed about whether and how government should respond.', kind: 'understanding', priority: 'lasting', level: 3, after: ['wst-u1', 'civ-u2'] },
        { key: 'ind-u2', text: 'The reform arguments of the Progressive Era, over trusts, labor, food safety and the vote, set patterns for later debates about the government’s role in the economy and in society.', kind: 'understanding', priority: 'lasting', level: 3, after: ['ind-u1', 'wst-u2'] },
        { key: 'ind-k1', text: 'The transcontinental railroad, Carnegie and Rockefeller, the Homestead and Pullman strikes, Ellis Island and the Chinese Exclusion Act, the Populists, Plessy v. Ferguson, the Sherman Antitrust Act, Theodore Roosevelt and trust-busting, The Jungle, the Pure Food and Drug Act, the woman suffrage movement and the Spanish-American War.', kind: 'knowledge', priority: 'important', level: 1, after: ['civ-k1'] },

        role: 'A person of the time: factory owner, union organizer, immigrant worker, farmer, reformer or newspaper editor', audience: 'A town hall of classmates and a visiting community member', product: 'A written position statement, a three-minute speech and a rebuttal on whether government should regulate the great trusts, using evidence from primary sources and data of the period' },

        { title: 'What do these numbers show?', method: 'performance', targets: ['skill'], level: 3, goals: ['ind-s1'], min: 20, fb: 'comments' },

    { key: 'war', title: 'War, Boom and Bust, 1914 to 1945', days: 22, source: 'curate',
      questions: ['How much should a government do when the economy collapses?', 'How should we judge a decision made in a crisis, knowing what we know now?'],
      goals: [
        { key: 'war-u1', text: 'The Great Depression and the New Deal changed what Americans expect from their government, and historians and citizens still argue about how well the New Deal worked and what it cost.', kind: 'understanding', priority: 'lasting', level: 3, after: ['ind-u2'] },
        { key: 'war-u2', text: 'Two world wars made the United States a global power and changed life at home, and they forced hard choices about liberty and security, such as the incarceration of Japanese Americans, and about what a nation owes the world.', kind: 'understanding', priority: 'lasting', level: 3, after: ['rev-u2', 'ind-u1'] },
        { key: 'war-k1', text: 'Entry into World War I and the League of Nations debate, the Great Migration and the Harlem Renaissance, the Red Scare and immigration limits, the 19th Amendment, the 1929 crash, the Dust Bowl, the New Deal (Social Security, the FDIC), Pearl Harbor, the home front, Executive Order 9066, the Holocaust, D-Day and the atomic bombs.', kind: 'knowledge', priority: 'important', level: 1, after: ['ind-k1'] },

        { title: 'Causes of the Depression, weighed', method: 'written', targets: ['reasoning'], level: 3, goals: ['war-s1'], min: 25, fb: 'comments' },

    { key: 'cld', title: 'The Cold War and the Struggle for Rights, 1945 to 1975', days: 20, source: 'curate',
      questions: ['How did fear of an outside enemy change life inside the country?', 'How does a movement turn a principle into a law?'],
      goals: [
        { key: 'cld-u1', text: 'The Cold War shaped American foreign policy and politics for decades, and the fear it produced affected civil liberties and daily life at home as well as actions abroad.', kind: 'understanding', priority: 'lasting', level: 3, after: ['war-u2'] },
        { key: 'cld-u2', text: 'The civil rights movement used courts, law, protest and organizing together to press the nation to live up to the 14th Amendment, and its gains came from the sustained work of ordinary people as well as famous leaders.', kind: 'understanding', priority: 'lasting', level: 3, after: ['civ-u2', 'rev-u1'] },
        { key: 'cld-k1', text: 'Containment and the Truman Doctrine, the Marshall Plan and NATO, Korea, McCarthyism, Sputnik, the Cuban Missile Crisis, the Vietnam War and the Tet Offensive, and Watergate and Nixon’s resignation.', kind: 'knowledge', priority: 'important', level: 1, after: ['war-k1'] },

        { key: 'cld-s2', text: 'Make a claim about change over time that connects events across decades, such as from Plessy to Brown to the Voting Rights Act, and test it against evidence that does not fit.', kind: 'skill', priority: 'important', level: 4, after: ['ind-s2', 'civ-s2'] },

      goals: [
        { key: 'eq-u1', text: 'An equation is a statement that two expressions have the same value; to solve it is to find every value of the variable that makes the statement true, and there may be none, one, several or infinitely many.', kind: 'understanding', priority: 'lasting', level: 3, after: [] },
        { key: 'eq-u2', text: 'A step in solving is safe only if it replaces the equation or inequality with an equivalent one, one with exactly the same solutions. Adding the same number to both sides, or multiplying or dividing both sides by the same nonzero number, keeps the solutions exactly because the step can be undone; multiplying by 0 or squaring can add false solutions, and dividing by an expression that might be zero can lose one. Multiplying or dividing an inequality by a negative number reverses it, because a negative number reverses order on the number line.', kind: 'understanding', priority: 'lasting', level: 3, after: ['eq-u1'] },
        { key: 'eq-k1', text: 'Variable, expression, term, coefficient, constant, equation, inequality and solution, and the properties of real numbers (commutative, associative and distributive) that justify rewriting an expression.', kind: 'knowledge', priority: 'important', level: 1, after: [] },
        { key: 'eq-s1', text: 'Solve linear equations and inequalities in one variable, including variables on both sides; check an equation by substituting its answer, and an inequality by testing one value inside and one outside the solution set; and show the solution set of an inequality on a number line.', kind: 'skill', priority: 'important', level: 2, after: ['eq-k1', 'eq-u2'] },
        { key: 'eq-s2', text: 'Translate a situation into an equation or inequality, say what the variable stands for, and interpret the solution in context, with its units.', kind: 'skill', priority: 'important', level: 3, after: ['eq-s1', 'eq-u1'] },

    { key: 'lin', title: 'Linear Functions and Constant Change', days: 24, source: 'curate',

      goals: [
        { key: 'lin-u1', text: 'A function is a dependable relationship that gives each input exactly one output, and a table, a graph, a rule and a description are four views of it, each showing something the others hide.', kind: 'understanding', priority: 'lasting', level: 3, after: ['eq-u1'] },
        { key: 'lin-u2', text: 'A linear function changes by equal amounts for equal changes in input, so its rate of change, the slope, is the same between any two points and its graph is a straight line; the points on that line are exactly the pairs (x, y) that make y = mx + b true.', kind: 'understanding', priority: 'lasting', level: 3, after: ['lin-u1', 'eq-u1'] },
        { key: 'lin-k1', text: 'Domain (the inputs allowed), range (the outputs that result), function notation f(x), slope (a vertical line has undefined slope and is not the graph of a function), intercepts, and the slope-intercept, point-slope and standard forms of a line.', kind: 'knowledge', priority: 'important', level: 1, after: [] },

        { key: 'lin-k2', text: 'Two different non-vertical lines are parallel when their slopes are equal and perpendicular when the product of their slopes is −1; a vertical line is perpendicular to a horizontal one.', kind: 'knowledge', priority: 'familiar', level: 2, after: ['lin-s1'] },
      ],
      major: { title: 'How tall is the stack?', method: 'performance', targets: ['reasoning', 'skill', 'product'], level: 3, goals: ['lin-u1', 'lin-u2', 'lin-s1', 'lin-s2'], min: 50, out: 45, fb: 'rubric', rubric: 'analytic', retake: true,
        role: 'A product tester for a paper-cup maker', audience: 'The purchasing manager of a cafeteria, who must fit stacks into a cupboard', product: 'A one-page report with measured data for the height of a stack of nested cups, a table, a graph and an equation, a prediction for 100 cups, what the slope and intercept mean in physical terms (and whether the intercept describes anything real), why only whole numbers of cups make sense, and where the model would stop being sensible' },
